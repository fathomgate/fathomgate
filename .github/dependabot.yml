version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    groups:
      go-deps:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: pip
    directory: /tests
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: monthly
    # The Dockerfile builder's Go minor must equal the go.mod `toolchain`
    # minor (ADR 0013). A Go minor bump is the manual toolchain bump in
    # CONTRIBUTING.md, never a Dependabot PR; distroless updates still flow.
    ignore:
      - dependency-name: golang
        update-types: ["version-update:semver-minor"]
