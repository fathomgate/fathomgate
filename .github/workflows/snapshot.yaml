# GoReleaser snapshot: builds every release artefact the way release.yaml
# would, without a tag, without publishing and without signing, then checks
# the properties a release must have (static binaries, nonroot image with no
# shell, go.mod untouched). Runs only when the release inputs change, or by
# hand. It does not prove "binaries on a tag"; only a pushed tag does (T0.6).
name: snapshot

on:
  workflow_dispatch:
  pull_request:
    paths:
      - .goreleaser.yaml
      - Dockerfile
      - Dockerfile.goreleaser
      - go.mod
      - go.sum
      - .github/workflows/release.yaml
      - .github/workflows/snapshot.yaml

permissions:
  contents: read

jobs:
  goreleaser:
    name: goreleaser snapshot + image checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          # Same toolchain selection as ci.yaml and release.yaml.
          go-version: "1.25.x"
          check-latest: true
          cache: true
      - uses: anchore/sbom-action/download-syft@v0
      - uses: docker/setup-buildx-action@v3
      - uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          # Same pin as release.yaml, so the snapshot exercises the release tool.
          version: v2.18.2
          args: release --snapshot --clean --skip=publish,sign
      - name: before-hook `go mod tidy` left go.mod and go.sum unchanged
        run: git diff --exit-code go.mod go.sum
      - name: five platform archives, checksums and one SBOM per archive
        run: |
          set -eu
          ls -l dist
          for t in linux_amd64 linux_arm64 darwin_amd64 darwin_arm64; do
            test -f dist/netguard_*_"$t".tar.gz
            test -f dist/netguard_*_"$t".tar.gz.spdx.sbom.json
          done
          test -f dist/netguard_*_windows_amd64.zip
          test -f dist/netguard_*_windows_amd64.zip.spdx.sbom.json
          test -s dist/checksums.txt
      - name: binaries are static, trimmed and built without cgo
        run: |
          set -eu
          file dist/netguard_*/netguard*
          for f in dist/netguard_linux_*/netguard; do
            file "$f" | grep -q 'statically linked'
          done
          for f in dist/netguard_*/netguard*; do
            go version -m "$f" | grep -q 'CGO_ENABLED=0'
            go version -m "$f" | grep -q -- '-trimpath=true'
          done
          dist/netguard_linux_amd64_v1/netguard version
      - name: image runs as nonroot and has no shell
        run: |
          set -eu
          image="$(docker images ghcr.io/joshscott13/netguard --format '{{.Repository}}:{{.Tag}}' | head -n1)"
          test -n "$image"
          docker run --rm "$image" version
          user="$(docker inspect --format '{{.Config.User}}' "$image")"
          echo "User: $user"
          case "$user" in nonroot|nonroot:nonroot|65532|65532:65532) ;; *) exit 1;; esac
          if docker run --rm --entrypoint sh "$image" -c true; then
            echo "image has a shell"; exit 1
          fi
      - name: root Dockerfile builds a static binary on distroless
        run: |
          set -eu
          docker build -t netguard:snapshot-dockerfile .
          docker run --rm netguard:snapshot-dockerfile version
          test "$(docker inspect --format '{{.Config.User}}' netguard:snapshot-dockerfile)" = "nonroot:nonroot"
      - uses: actions/upload-artifact@v4
        with:
          name: goreleaser-snapshot
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.spdx.sbom.json
            dist/checksums.txt
          retention-days: 7
