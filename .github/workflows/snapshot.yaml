# GoReleaser snapshot: builds every release artefact the way release.yaml
# would, without a tag, without publishing and without signing, then checks
# the properties a release must have (static binaries, nonroot image with no
# shell, go.mod untouched). Runs only when the release inputs change, or by
# hand. It does not prove "binaries on a tag"; only a pushed tag does (T0.6).
name: snapshot

on:
  workflow_dispatch:
  pull_request:
    paths:
      - .goreleaser.yaml
      - Dockerfile
      - Dockerfile.goreleaser
      - go.mod
      - go.sum
      - .github/workflows/release.yaml
      - .github/workflows/snapshot.yaml
      - LICENSE
      - NOTICE
      - TRADEMARKS.md
      - THIRD_PARTY_LICENSES/**
      - tools/licences/**

permissions:
  contents: read

jobs:
  goreleaser:
    name: goreleaser snapshot + image checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # The `toolchain` line in go.mod, same as ci.yaml and release.yaml.
          go-version-file: go.mod
          cache: true
      - name: Go in use is the go.mod toolchain
        run: make toolchain-check
      - uses: anchore/sbom-action/download-syft@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          # Same pin as release.yaml, so the snapshot exercises the release tool.
          version: v2.18.2
          args: release --snapshot --clean --skip=publish,sign
      - name: before-hook `go mod tidy` left go.mod and go.sum unchanged
        run: git diff --exit-code go.mod go.sum
      - name: six platform archives, checksums and one SBOM per archive
        run: |
          set -eu
          ls -l dist
          for t in linux_amd64 linux_arm64 darwin_amd64 darwin_arm64; do
            test -f dist/fathomgate_*_"$t".tar.gz
            test -f dist/fathomgate_*_"$t".tar.gz.spdx.sbom.json
          done
          for t in windows_amd64 windows_arm64; do
            test -f dist/fathomgate_*_"$t".zip
            test -f dist/fathomgate_*_"$t".zip.spdx.sbom.json
          done
          test -s dist/checksums.txt
      - name: every archive carries LICENSE, NOTICE and THIRD_PARTY_LICENSES (ADR 0020)
        run: |
          set -eu
          { printf '%s\n' LICENSE NOTICE TRADEMARKS.md; find THIRD_PARTY_LICENSES -type f; } | sort > want.txt
          missing=0
          for a in dist/fathomgate_*.tar.gz dist/fathomgate_*.zip; do
            case "$a" in
              *.zip) unzip -Z1 "$a" | sort > have.txt ;;
              *) tar -tzf "$a" | sort > have.txt ;;
            esac
            if ! comm -23 want.txt have.txt | grep . ; then continue; fi
            echo "::error::$a lacks the files above"
            missing=1
          done
          rm -f want.txt have.txt
          exit "$missing"
      - name: binaries are static, trimmed and built without cgo
        run: |
          set -eu
          file dist/fathomgate_*/fathomgate*
          for f in dist/fathomgate_linux_*/fathomgate; do
            file "$f" | grep -q 'statically linked'
          done
          for f in dist/fathomgate_*/fathomgate*; do
            go version -m "$f" | grep -q 'CGO_ENABLED=0'
            go version -m "$f" | grep -q -- '-trimpath=true'
          done
          dist/fathomgate_linux_amd64_v1/fathomgate version
      - name: image runs as nonroot and has no shell
        run: |
          set -eu
          image="$(docker images ghcr.io/fathomgate/fathomgate --format '{{.Repository}}:{{.Tag}}' | head -n1)"
          test -n "$image"
          docker run --rm "$image" version
          user="$(docker inspect --format '{{.Config.User}}' "$image")"
          echo "User: $user"
          case "$user" in nonroot|nonroot:nonroot|65532|65532:65532) ;; *) exit 1;; esac
          if docker run --rm --entrypoint sh "$image" -c true; then
            echo "image has a shell"; exit 1
          fi
          # No shell to list with, so copy the licence folder out (ADR 0020).
          cid="$(docker create "$image")"
          docker cp "$cid:/usr/share/doc/fathomgate" image-doc
          docker rm "$cid"
          cmp LICENSE image-doc/LICENSE
          cmp NOTICE image-doc/NOTICE
          diff -r THIRD_PARTY_LICENSES image-doc/THIRD_PARTY_LICENSES
          rm -rf image-doc
      - name: root Dockerfile builds a static binary on distroless
        run: |
          set -eu
          docker build -t fathomgate:snapshot-dockerfile .
          docker run --rm fathomgate:snapshot-dockerfile version
          test "$(docker inspect --format '{{.Config.User}}' fathomgate:snapshot-dockerfile)" = "nonroot:nonroot"
          cid="$(docker create fathomgate:snapshot-dockerfile)"
          docker cp "$cid:/usr/share/doc/fathomgate" dockerfile-doc
          docker rm "$cid"
          cmp NOTICE dockerfile-doc/NOTICE
          diff -r THIRD_PARTY_LICENSES dockerfile-doc/THIRD_PARTY_LICENSES
          rm -rf dockerfile-doc
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: goreleaser-snapshot
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.spdx.sbom.json
            dist/checksums.txt
          retention-days: 7
