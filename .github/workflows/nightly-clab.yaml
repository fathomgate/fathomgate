# Tier 3 placeholder: real upstream MCP server against real network OS images
# in containerlab (cEOS needs an Arista account, so this cannot run on hosted
# runners). Nothing here executes yet; the job is a skeleton for the
# self-hosted runner that arrives with M3/M5. See docs/PLAN.md "Test matrix".
name: nightly-clab (tier 3, placeholder)

on:
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * *" # 06:17 UTC daily

permissions:
  contents: read

jobs:
  clab:
    name: containerlab topology (self-hosted)
    # Change to the real label once a runner with containerlab, docker and
    # the cEOS / SR Linux images is registered.
    runs-on: [self-hosted, clab]
    if: ${{ vars.FATHOMGATE_CLAB_ENABLED == 'true' }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # The `toolchain` line in go.mod, same as ci.yaml (ADR 0013).
          # setup-go v6 runs on node24: the self-hosted runner must be
          # actions/runner v2.327.1 or later.
          go-version-file: go.mod
      - name: Go in use is the go.mod toolchain
        run: make toolchain-check
      - name: build proxy
        run: make build
      - name: deploy topology
        run: |
          echo "TODO(M3): containerlab deploy -t tests/clab/topology.clab.yaml"
          echo "TODO(M3): start eos-mcp / junos-mcp-server containers pointing at the lab"
      - name: tier 3 assertions
        run: |
          echo "TODO(M3): uv run pytest tests/clab -m tier3"
          echo "cases: timed rollback fires; watchdog rollback; device-tagged-lab write with commit timer"
      - name: destroy topology
        if: always()
        # Keep the block scalar: a plain `run: echo "TODO(M3): ..."` is invalid
        # YAML (the ": " inside it starts a mapping), which made GitHub reject
        # the whole file and record a failed "push" run on every push (T0.9).
        run: |
          echo "TODO(M3): containerlab destroy -t tests/clab/topology.clab.yaml --cleanup"
