name: release

on:
  push:
    tags: ["v*"]

# No workflow-wide grants; each job asks for what it needs.
permissions: {}

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the GitHub release and upload archives
      # packages: write (push the image to ghcr.io) comes back when
      # .goreleaser.yaml sets skip_push to auto; the image is not pushed yet.
      # cosign keyless signing of checksums.txt (signs: in .goreleaser.yaml):
      # the OIDC token becomes a Fulcio certificate naming this workflow at
      # the tag. Granted to this job only; this workflow runs on tag pushes,
      # never on pull requests, and no pull_request workflow has it.
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # The `toolchain` line in go.mod, same as ci.yaml (ADR 0013).
          # setup-go v6 installs it and exports GOTOOLCHAIN=local, so the
          # binaries are built with exactly the Go that CI tested.
          go-version-file: go.mod
          # No module or build cache in the release job: a poisoned cache
          # from another workflow must not reach a published binary.
          cache: false
      # The release page text is written in the release PR from the
      # CHANGELOG.md section (.claude/commands/release.md), not generated from
      # commit subjects. A tag without it stops here, before anything is built.
      - name: Release notes for this tag exist
        env:
          TAG: ${{ github.ref_name }}
        run: test -s "docs/releases/${TAG}.md"
      # A release is built with the go.mod toolchain or not at all.
      - name: Go in use is the go.mod toolchain
        run: make toolchain-check
      # Same pinned govulncheck as ci.yaml (Makefile GOVULNCHECK_VERSION,
      # v1.8.0): a vulnerability reachable from our code stops the release
      # before anything is built or published.
      - name: govulncheck ./...
        run: make vulncheck
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          # Pinned; the installer checks the download's signature.
          cosign-release: v3.1.3
      - uses: anchore/sbom-action/download-syft@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          # Pinned, same as snapshot.yaml: the release uses the GoReleaser
          # that the last snapshot run exercised.
          version: v2.18.2
          # The release page text is docs/releases/<tag>.md (see the
          # "Release notes for this tag exist" step); .goreleaser.yaml
          # `release.footer` is appended to it.
          args: release --clean --release-notes docs/releases/${{ github.ref_name }}.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Optional: set in repo secrets once fathomgate/homebrew-tap exists.
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}
