name: release

on:
  push:
    tags: ["v*"]

# No workflow-wide grants; each job asks for what it needs.
permissions: {}

jobs:
  # Everything that runs repository or dependency code (tests, go mod tidy,
  # govulncheck, the licence scripts) runs here, with a read-only token and no
  # OIDC. The goreleaser job, which can mint a signing identity, starts only
  # after this one passes and runs no test code itself (--skip=before).
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # The `toolchain` line in go.mod, same as ci.yaml (ADR 0013).
          go-version-file: go.mod
          # No module or build cache in the release workflow: a poisoned
          # cache from another workflow must not reach a published binary.
          cache: false
      # A release is built with the go.mod toolchain or not at all.
      - name: Go in use is the go.mod toolchain
        run: make toolchain-check
      # These four replace the .goreleaser.yaml before hooks, which the
      # goreleaser job skips.
      - name: go test ./...
        run: go test -count=1 ./...
      - name: go mod tidy leaves go.mod and go.sum unchanged
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum
      # Same pinned govulncheck as ci.yaml (Makefile GOVULNCHECK_VERSION): a
      # vulnerability reachable from our code stops the release.
      - name: govulncheck ./...
        run: make vulncheck
      # THIRD_PARTY_LICENSES/, NOTICE and SPDX lines match what ships (ADR 0020).
      - name: licences-check
        run: make licences-check PYTHON=python3

  goreleaser:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the GitHub release and upload archives
      # cosign keyless signing of checksums.txt (signs: in .goreleaser.yaml):
      # the OIDC token becomes a Fulcio certificate naming this workflow at
      # the tag. Granted to this job only; this workflow runs on tag pushes,
      # never on pull requests, and no pull_request workflow has it.
      id-token: write
      # packages: write (push the image to ghcr.io) comes back when
      # .goreleaser.yaml sets skip_push to auto; the image is not pushed yet.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # setup-go installs the go.mod toolchain and exports
          # GOTOOLCHAIN=local, so the binaries are built with exactly the Go
          # that the test job and CI tested.
          go-version-file: go.mod
          cache: false
      # The tag must be a plain semver tag, and the release page text is
      # docs/releases/<tag>.md, written in the release PR from the
      # CHANGELOG.md section (.claude/commands/release.md). It is copied to a
      # fixed path so no tag text reaches GoReleaser's arguments.
      - name: Tag is vX.Y.Z and its release notes exist
        env:
          TAG: ${{ github.ref_name }}
        run: |
          if ! printf '%s\n' "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$'; then
            echo "::error::tag is not vX.Y.Z[-pre]"
            exit 1
          fi
          test -s "docs/releases/${TAG}.md"
          cp "docs/releases/${TAG}.md" "$RUNNER_TEMP/release-notes.md"
      - name: Go in use is the go.mod toolchain
        run: make toolchain-check
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          # Pinned; the installer checks the download's signature.
          cosign-release: v3.1.3
      - uses: anchore/sbom-action/download-syft@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
      # buildx builds the image (dockers: in .goreleaser.yaml), which is not
      # pushed. When the image is published, restore here, with packages:
      # write above: docker/setup-qemu-action (arm64 build) and
      # docker/login-action to ghcr.io with GITHUB_TOKEN.
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          # Pinned, same as snapshot.yaml: the release uses the GoReleaser
          # that the last snapshot run exercised.
          version: v2.18.2
          # --skip=before: the before hooks run test and dependency code; the
          # test job above ran them without id-token. .goreleaser.yaml
          # `release.footer` is appended to the notes.
          args: release --clean --skip=before --release-notes ${{ runner.temp }}/release-notes.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # HOMEBREW_TAP_GITHUB_TOKEN comes back here with the tap
          # (fathomgate/homebrew-tap) and skip_upload: auto in .goreleaser.yaml.
