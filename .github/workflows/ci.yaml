# Tier 1: runs on every push and pull request with no network access to
# devices or upstream servers. Tier 2 (real servers in containers) joins when
# M0 lands; tier 3 lives in nightly-clab.yaml.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  # Newest Go 1.25 patch, not the go.mod floor: `go-version-file: go.mod`
  # installs exactly go1.25.0, whose standard library has known fixed
  # vulnerabilities that govulncheck reports as reachable. Keep the minor in
  # step with the `go` line in go.mod (and release.yaml, nightly-clab.yaml).
  GO_VERSION: "1.25.x"

jobs:
  go:
    name: go build / vet / test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true
          cache: true
      - run: go build ./...
      - run: go vet ./...
      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - run: go test -race -count=1 ./...
      - name: policy suites
        run: make policy-test
      - name: redaction fixtures
        run: make fixtures-check

  lint:
    name: golangci-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true
          cache: true
      - uses: golangci/golangci-lint-action@v7
        with:
          # v2.4 is the first line built with Go 1.25; v2.1 refuses a go 1.25 module.
          version: v2.4.0

  vuln:
    name: govulncheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true
          cache: true
      # `make vulncheck` runs golang.org/x/vuln/cmd/govulncheck at the version
      # pinned in the Makefile (GOVULNCHECK_VERSION) via `go run pkg@version`,
      # so go.mod and go.sum stay unchanged. Exit 3 (a vulnerability reachable
      # from our code, stdlib included) fails the job; findings only in
      # required modules that no symbol reaches are printed, not fatal.
      - name: govulncheck ./...
        run: make vulncheck

  python:
    name: policy-lint smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: unit tests (tier 1)
        working-directory: tests
        run: uv run --extra dev pytest unit -q
      - name: lint every shipped policy
        working-directory: tests
        run: |
          for f in ../policies/examples/*.yaml; do
            case "$f" in *.test.yaml) continue;; esac
            uv run python -m policy_lint "$f"
          done

  status:
    name: STATUS.md is current
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      - name: board and STATUS.md agree
        run: python3 tools/status/render.py --check
