# Tier 1: runs on every push and pull request with no network access to
# devices or upstream servers. Tier 2 (real servers in containers) joins when
# M0 lands; tier 3 lives in nightly-clab.yaml.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  # Weekly, so govulncheck sees new advisories even when nothing is pushed.
  schedule:
    - cron: "23 5 * * 1" # Mondays 05:23 UTC

permissions:
  contents: read

# Go toolchain (ADR 0013): every setup-go step reads `go-version-file: go.mod`.
# setup-go v6 installs the `toolchain` line, not the `go` floor, and exports
# GOTOOLCHAIN=local so no step switches toolchains. The toolchain version
# lives in go.mod only; bump it there (docs/maintainers.md). Jobs that build run
# `make toolchain-check` right after setup-go.

jobs:
  go:
    name: go build / vet / test
    runs-on: ubuntu-latest
    # The H1 regression tests (both loopback families bound) fail instead of
    # skipping when the runner lacks one (security review of PR #112).
    env:
      FATHOMGATE_REQUIRE_BOTH_LOOPBACKS: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Go in use is the go.mod toolchain
        run: make toolchain-check
      - run: go build ./...
      - run: go vet ./...
      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - run: go test -race -count=1 ./...
      # Proof in the log that the H1 regression tests ran and passed.
      - name: H1 loopback tests ran
        run: |
          go test -count=1 -v -run 'TestBindLoopbackHoldsBothFamilies|TestBindLoopbackRefusesTakenOtherFamily|TestServeListenOtherFamilyTaken' ./cmd/fathomgate/ | tee h1.log
          missing=0
          for t in \
            TestBindLoopbackHoldsBothFamilies \
            TestBindLoopbackRefusesTakenOtherFamily \
            TestServeListenOtherFamilyTaken; do
            if ! grep -qF -- "--- PASS: $t (" h1.log; then
              echo "::error::$t did not print --- PASS"
              missing=1
            fi
          done
          exit "$missing"
      - name: policy suites
        run: make policy-test
      - name: redaction fixtures
        run: make fixtures-check
      # ADR 0020: THIRD_PARTY_LICENSES/ and NOTICE match the modules linked
      # into fathomgate, and every Go, Python and shell file has its SPDX line.
      - name: licences and SPDX headers
        run: make licences-check PYTHON=python3

  # Official MCP conformance suite against the client-facing side of
  # `fathomgate serve`, both protocol eras (T0.4, M0 exit criterion 1). A
  # required status check on main: its name must stay "mcp-conformance", and
  # it must run on every pull request, with no `paths:` filter, including
  # Dependabot's (it needs no secrets). A go-sdk bump rebuilds the fixture
  # upstream (go-sdk's own conformance everything-server at the go.mod
  # version) and must pass here before it merges (docs/maintainers.md). A
  # second upstream, the same server at go-sdk v1.6.1 (2025-11-25 only,
  # T0.19), is built from the test-only module tests/conformance/upstream-2025
  # and never moves with a bump. The suite version is pinned in
  # tests/conformance/package-lock.json; the legs, the relay and the
  # baselines are explained in tests/conformance/README.md. python3 on
  # ubuntu-latest runs relay.py and era_pairs.py, which use the standard
  # library only.
  conformance:
    name: mcp-conformance
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: |
            go.sum
            tests/conformance/upstream-2025/go.sum
      - name: Go in use is the go.mod toolchain
        run: make toolchain-check
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: conformance suite, 2025-11-25 and 2026-07-28 (control and fathomgate legs, current and 2025 upstreams), era pairs
        run: make conformance PYTHON=python3
      - name: keep results on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: conformance-results
          path: tests/conformance/results/
          retention-days: 7

  # Tier 2 client smoke (T0.5, matrix rows 1 and 22): fathomgate serve in front
  # of the real netdev-ssh-mcp release binary, pinned by version and sha256,
  # with the fake SSH device standing in for the router. No Docker, no
  # network beyond the downloads. FATHOMGATE_TIER2_REQUIRED=1 turns a missing
  # binary into a failure, so this job cannot go green by skipping. Bump the
  # version here, in tests/integration/conftest.py and in the matrix together.
  client-smoke:
    name: tier2 client smoke (netdev-ssh-mcp)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      NETDEV_SSH_MCP_VERSION: 1.7.1
      NETDEV_SSH_MCP_SHA256: f90795b45c3fff89aabe56b6327f53ddda15825db60a8cde0d1b23b6be30c9e7
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - name: build fathomgate
        run: make build
      - name: fetch netdev-ssh-mcp release binary
        run: |
          bin="netdev-ssh-mcp_${NETDEV_SSH_MCP_VERSION}_linux_amd64"
          mkdir -p "$RUNNER_TEMP/upstream"
          curl -fsSL -o "$RUNNER_TEMP/upstream/$bin" \
            "https://github.com/krisiasty/netdev-ssh-mcp/releases/download/v${NETDEV_SSH_MCP_VERSION}/$bin"
          echo "${NETDEV_SSH_MCP_SHA256}  $RUNNER_TEMP/upstream/$bin" | sha256sum -c -
          chmod +x "$RUNNER_TEMP/upstream/$bin"
          echo "FATHOMGATE_UPSTREAM=$RUNNER_TEMP/upstream/$bin" >> "$GITHUB_ENV"
      # Only this upstream's cases; the upa cases run in tier2-upa. A marker
      # that selects nothing makes pytest exit 5, which fails the step.
      - name: tier 2 through fathomgate serve (passthrough and PATH-stripped launcher)
        working-directory: tests
        env:
          FATHOMGATE_TIER2_REQUIRED: "1"
        run: uv run --extra integration pytest integration -m "tier2 and netdev_ssh_mcp" -v

  # Tier 2 against the 2025-era upstream (T0.34, matrix row 2, M0 exit
  # criterion 3): fathomgate serve in front of the real upa/mcp-netmiko-server,
  # pinned by commit (git checks the id, the tests check main.py's sha256),
  # with the fake SSH device answering netmiko's interactive shell. install.sh
  # builds two Python 3.13 environments: requirements.txt (mcp 1.30.0, every
  # wheel hash-checked by --require-hashes), which negotiates 2025-11-25, and
  # the upstream's own uv.lock (mcp 1.6.0, hashes checked by uv sync --locked),
  # whose case is a strict xfail until fathomgate can reach it. Runs on every
  # pull request with no path filter; FATHOMGATE_TIER2_REQUIRED=1 turns a
  # missing install into a failure, so it cannot go green by skipping.
  tier2-upa:
    name: tier2 upa/mcp-netmiko-server (2025 era)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - name: build fathomgate
        run: make build
      - name: install upa/mcp-netmiko-server (pinned commit, hash-checked dependencies)
        run: tests/integration/upstreams/upa-mcp-netmiko-server/install.sh "$RUNNER_TEMP/upa" >> "$GITHUB_ENV"
      - name: tier 2 through fathomgate serve (both agent eras, 2025-11-25 upstream)
        working-directory: tests
        env:
          FATHOMGATE_TIER2_REQUIRED: "1"
        run: uv run --extra integration pytest integration -m "tier2 and upa_mcp_netmiko_server" -v

  # The Windows key and log DACL code in internal/audit (T0.12) only compiles
  # and runs on Windows. Hosted windows-latest runners run elevated (the
  # runner account is an administrator with UAC off), so they hold
  # SeCreateSymbolicLinkPrivilege and may give a file another owner.
  # FATHOMGATE_REQUIRE_PRIVILEGED_TESTS=1 turns the skip in needPrivilege
  # (key_windows_test.go) into a failure: the symlink, dangling-symlink,
  # junction and other-owner tests must run here and cannot skip. If GitHub
  # ever runs this image unelevated or without the symlink privilege, this
  # job must fail loudly. Do not drop the variable or accept skips to make it
  # green; fix the runner or move to one that is elevated. No -race: the
  # Linux `go` job covers the race detector. The same `go test` also runs the
  # upstream's Job Object code in internal/proxy (ADR 0021, T0.46).
  windows:
    name: go vet / test (windows, elevated)
    runs-on: windows-latest
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    env:
      FATHOMGATE_REQUIRE_PRIVILEGED_TESTS: "1"
      FATHOMGATE_REQUIRE_BOTH_LOOPBACKS: "1"
    steps:
      # Check out LF as on Linux, so go.mod, the fixtures and the golden files
      # are the same bytes the other jobs test.
      - name: no CRLF conversion on checkout
        run: git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      # `make toolchain-check` in bash: GNU make is not on windows-latest.
      - name: Go in use is the go.mod toolchain
        run: |
          want="$(sed -n 's/^toolchain //p' go.mod | tr -d '\r')"
          got="$(go env GOVERSION)"
          if [ -z "$want" ]; then
            echo "go.mod has no toolchain line (ADR 0013)"
            exit 1
          fi
          if [ "$got" != "$want" ]; then
            echo "Go in use is $got, go.mod toolchain is $want (ADR 0013)"
            exit 1
          fi
          echo "Go in use is $got, the go.mod toolchain"
      - run: go vet ./...
      - run: go test -count=1 ./...
      - name: H1 loopback tests ran
        run: |
          go test -count=1 -v -run 'TestBindLoopbackHoldsBothFamilies|TestBindLoopbackRefusesTakenOtherFamily|TestServeListenOtherFamilyTaken' ./cmd/fathomgate/ | tee h1.log
          missing=0
          for t in \
            TestBindLoopbackHoldsBothFamilies \
            TestBindLoopbackRefusesTakenOtherFamily \
            TestServeListenOtherFamilyTaken; do
            if ! grep -qF -- "--- PASS: $t (" h1.log; then
              echo "::error::$t did not print --- PASS"
              missing=1
            fi
          done
          exit "$missing"
      # Proof in the log that every Windows DACL test ran and passed: each
      # must print `--- PASS`, and no test may print `--- SKIP`.
      - name: Windows audit tests ran elevated
        run: |
          go test -count=1 -v -run 'Windows' ./internal/audit/ | tee audit-windows.log
          if grep -F -- '--- SKIP' audit-windows.log; then
            echo "::error::a Windows audit test skipped; the runner is not elevated or lacks SeCreateSymbolicLinkPrivilege"
            exit 1
          fi
          missing=0
          for t in \
            TestSaveKeyWindowsDACL \
            TestWriterWindowsDACL \
            TestNewWriterWindowsRefusesSymlink \
            TestNewWriterWindowsRefusesJunction \
            TestWindowsDanglingSymlinkNotFollowed \
            TestWindowsDanglingSymlinkNotFollowed/key \
            TestWindowsDanglingSymlinkNotFollowed/pub \
            TestWindowsDanglingSymlinkNotFollowed/log \
            TestNewWriterWindowsHardLinkKeepsDACL \
            TestNewWriterWindowsBrokenChainKeepsDACL \
            TestNewWriterWindowsRefusesOtherOwner; do
            if ! grep -qF -- "--- PASS: $t (" audit-windows.log; then
              echo "::error::$t did not print --- PASS"
              missing=1
            fi
          done
          exit "$missing"

  # macOS runs two things the Linux job cannot.
  # - ADR 0021, T0.46: the upstream's process group (Setpgid, the group
  #   kill, the post-reap sweep) runs on Darwin's syscall code; lint's darwin
  #   cross-analysis only compiles it. The internal/proxy tests start a
  #   launcher fixture whose child must be gone after the restart, a failed
  #   start, Close and a mid-session exit.
  # - T0.52: the extended-ACL checks (internal/fileacl, used by the listen
  #   token file check and the audit key and log; L2 in the security review
  #   of PR #109) call fgetattrlist(2) directly and are only compiled on
  #   darwin. The tests set real ACLs with chmod +a. The proof step fails
  #   unless each of them, and the H1 loopback tests, prints `--- PASS`.
  # macos-latest is arm64: darwin/amd64 is linted but not run. Not a required
  # check yet: the maintainer adds it to the main ruleset once it has proven
  # stable. `make toolchain-check` works with macOS's make.
  macos:
    name: go test (macos)
    runs-on: macos-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      FATHOMGATE_REQUIRE_BOTH_LOOPBACKS: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Go in use is the go.mod toolchain
        run: make toolchain-check
      - run: go vet ./...
      - run: go test -count=1 ./...
      - run: go test -race -count=1 ./internal/proxy/
      - name: ACL, token file, audit file and H1 tests ran on macOS
        run: |
          go test -count=1 -v -run 'Extended|ParseAttrBuf|ReadTokenFile|Darwin|SaveKey|NewWriter|Writer|TestBindLoopbackHoldsBothFamilies|TestBindLoopbackRefusesTakenOtherFamily|TestServeListenOtherFamilyTaken' \
            ./internal/fileacl/ ./cmd/fathomgate/ ./internal/audit/ | tee macos.log
          missing=0
          for t in \
            TestBindLoopbackHoldsBothFamilies \
            TestBindLoopbackRefusesTakenOtherFamily \
            TestServeListenOtherFamilyTaken \
            TestExtendedDarwin \
            TestParseAttrBuf \
            TestReadTokenFileUnix \
            TestReadTokenFileDarwinACL \
            TestDarwinInheritedACLRefused \
            TestDarwinExistingLogWithACLRefused; do
            if ! grep -qF -- "--- PASS: $t (" macos.log; then
              echo "::error::$t did not print --- PASS"
              missing=1
            fi
          done
          exit "$missing"

  lint:
    name: golangci-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Go in use is the go.mod toolchain
        run: make toolchain-check
      # `make lint` downloads the golangci-lint release archive pinned in the
      # Makefile (GOLANGCI_LINT_VERSION), checks its sha256 against the hash
      # committed there before unpacking it, then runs `config verify` and
      # `run` for linux, darwin and windows on amd64 and arm64 (every release target)
      # (T0.20, T0.24). It replaces golangci-lint-action, which downloads the
      # archive without verifying it. Must be built with a
      # Go at least as new as the go.mod toolchain minor, or it refuses to run
      # (v2.9.0 is the first release built with Go 1.26).
      - name: golangci-lint (sha256-verified release binary)
        run: make lint

  vuln:
    name: govulncheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      # `make vulncheck` runs golang.org/x/vuln/cmd/govulncheck at the version
      # pinned in the Makefile (GOVULNCHECK_VERSION) via `go run pkg@version`,
      # so go.mod and go.sum stay unchanged. govulncheck exits 3 when a
      # vulnerability is reachable from our code (stdlib included); `go run`
      # reports that as exit 1, which fails the job. Findings only in required
      # modules that no symbol reaches are printed and exit 0.
      - name: govulncheck ./...
        run: make vulncheck

  actionlint:
    name: actionlint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      # `make actionlint` runs github.com/rhysd/actionlint at the version pinned
      # in the Makefile (ACTIONLINT_VERSION) via `go run pkg@version`, with
      # .github/actionlint.yaml for the self-hosted `clab` label. shellcheck is
      # preinstalled on ubuntu-latest, so `run:` scripts are checked too. A broken workflow file fails its pull request instead
      # of main (T0.9).
      - name: actionlint .github/workflows
        run: make actionlint

  python:
    name: policy-lint smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - name: unit tests (tier 1)
        working-directory: tests
        run: uv run --extra dev pytest unit -q
      - name: lint every shipped policy
        working-directory: tests
        run: |
          for f in ../policies/examples/*.yaml; do
            case "$f" in *.test.yaml) continue;; esac
            uv run python -m policy_lint "$f"
          done

  status:
    name: STATUS.md is current
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # uv, not setup-python: actions/python-versions has no build for the
      # runner's Ubuntu release, and uv brings its own interpreter.
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - name: board and STATUS.md agree
        run: uv run --no-project --python 3.12 --with pyyaml python tools/status/render.py --check
