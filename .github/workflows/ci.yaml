# Tier 1: runs on every push and pull request with no network access to
# devices or upstream servers. Tier 2 (real servers in containers) joins when
# M0 lands; tier 3 lives in nightly-clab.yaml.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  # Weekly, so govulncheck sees new advisories even when nothing is pushed.
  schedule:
    - cron: "23 5 * * 1" # Mondays 05:23 UTC

permissions:
  contents: read

# Go toolchain (ADR 0013): every setup-go step reads `go-version-file: go.mod`.
# setup-go v6 installs the `toolchain` line, not the `go` floor, and exports
# GOTOOLCHAIN=local so no step switches toolchains. The toolchain version
# lives in go.mod only; bump it there (CONTRIBUTING.md). Jobs that build run
# `make toolchain-check` right after setup-go.

jobs:
  go:
    name: go build / vet / test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Go in use is the go.mod toolchain
        run: make toolchain-check
      - run: go build ./...
      - run: go vet ./...
      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - run: go test -race -count=1 ./...
      - name: policy suites
        run: make policy-test
      - name: redaction fixtures
        run: make fixtures-check

  lint:
    name: golangci-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          # Must be built with a Go at least as new as the go.mod toolchain
          # minor, or it refuses to run ("the Go language version (go1.25)
          # used to build golangci-lint is lower than the targeted Go
          # version"). v2.9.0 is the first release built with Go 1.26
          # (go1.26.0, commit 72798d34); v2.8.0 is built with go1.25.5.
          version: v2.9.0

  vuln:
    name: govulncheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      # `make vulncheck` runs golang.org/x/vuln/cmd/govulncheck at the version
      # pinned in the Makefile (GOVULNCHECK_VERSION) via `go run pkg@version`,
      # so go.mod and go.sum stay unchanged. govulncheck exits 3 when a
      # vulnerability is reachable from our code (stdlib included); `go run`
      # reports that as exit 1, which fails the job. Findings only in required
      # modules that no symbol reaches are printed and exit 0.
      - name: govulncheck ./...
        run: make vulncheck

  actionlint:
    name: actionlint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      # `make actionlint` runs github.com/rhysd/actionlint at the version pinned
      # in the Makefile (ACTIONLINT_VERSION) via `go run pkg@version`, with
      # .github/actionlint.yaml for the self-hosted `clab` label. shellcheck is
      # preinstalled on ubuntu-latest, so `run:` scripts are checked too. A
      # broken workflow file fails its pull request instead of main (T0.9).
      - name: actionlint .github/workflows
        run: make actionlint

  python:
    name: policy-lint smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
      - name: unit tests (tier 1)
        working-directory: tests
        run: uv run --extra dev pytest unit -q
      - name: lint every shipped policy
        working-directory: tests
        run: |
          for f in ../policies/examples/*.yaml; do
            case "$f" in *.test.yaml) continue;; esac
            uv run python -m policy_lint "$f"
          done

  status:
    name: STATUS.md is current
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      - name: board and STATUS.md agree
        run: python3 tools/status/render.py --check
