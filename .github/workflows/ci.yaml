# Tier 1: runs on every push and pull request with no network access to
# devices or upstream servers. Tier 2 (real servers in containers) joins when
# M0 lands; tier 3 lives in nightly-clab.yaml.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  # Weekly, so govulncheck sees new advisories even when nothing is pushed.
  schedule:
    - cron: "23 5 * * 1" # Mondays 05:23 UTC

permissions:
  contents: read

# Go toolchain (ADR 0013): every setup-go step reads `go-version-file: go.mod`.
# setup-go v6 installs the `toolchain` line, not the `go` floor, and exports
# GOTOOLCHAIN=local so no step switches toolchains. The toolchain version
# lives in go.mod only; bump it there (CONTRIBUTING.md). Jobs that build run
# `make toolchain-check` right after setup-go.

jobs:
  go:
    name: go build / vet / test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Go in use is the go.mod toolchain
        run: make toolchain-check
      - run: go build ./...
      - run: go vet ./...
      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - run: go test -race -count=1 ./...
      - name: policy suites
        run: make policy-test
      - name: redaction fixtures
        run: make fixtures-check

  # The Windows key and log DACL code in internal/audit (T0.12) only compiles
  # and runs on Windows. Hosted windows-latest runners run elevated (the
  # runner account is an administrator with UAC off), so they hold
  # SeCreateSymbolicLinkPrivilege and may give a file another owner.
  # NETGUARD_REQUIRE_PRIVILEGED_TESTS=1 turns the skip in needPrivilege
  # (key_windows_test.go) into a failure: the symlink, dangling-symlink,
  # junction and other-owner tests must run here and cannot skip. If GitHub
  # ever runs this image unelevated or without the symlink privilege, this
  # job must fail loudly. Do not drop the variable or accept skips to make it
  # green; fix the runner or move to one that is elevated. No -race: the
  # Linux `go` job covers the race detector.
  windows:
    name: go vet / test (windows, elevated)
    runs-on: windows-latest
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    env:
      NETGUARD_REQUIRE_PRIVILEGED_TESTS: "1"
    steps:
      # Check out LF as on Linux, so go.mod, the fixtures and the golden files
      # are the same bytes the other jobs test.
      - name: no CRLF conversion on checkout
        run: git config --global core.autocrlf false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache: true
      # `make toolchain-check` in bash: GNU make is not on windows-latest.
      - name: Go in use is the go.mod toolchain
        run: |
          want="$(sed -n 's/^toolchain //p' go.mod | tr -d '\r')"
          got="$(go env GOVERSION)"
          if [ -z "$want" ]; then
            echo "go.mod has no toolchain line (ADR 0013)"
            exit 1
          fi
          if [ "$got" != "$want" ]; then
            echo "Go in use is $got, go.mod toolchain is $want (ADR 0013)"
            exit 1
          fi
          echo "Go in use is $got, the go.mod toolchain"
      - run: go vet ./...
      - run: go test -count=1 ./...
      # Proof in the log that every Windows DACL test ran and passed: each
      # must print `--- PASS`, and no test may print `--- SKIP`.
      - name: Windows audit tests ran elevated
        run: |
          go test -count=1 -v -run 'Windows' ./internal/audit/ | tee audit-windows.log
          if grep -F -- '--- SKIP' audit-windows.log; then
            echo "::error::a Windows audit test skipped; the runner is not elevated or lacks SeCreateSymbolicLinkPrivilege"
            exit 1
          fi
          missing=0
          for t in \
            TestSaveKeyWindowsDACL \
            TestWriterWindowsDACL \
            TestNewWriterWindowsRefusesSymlink \
            TestNewWriterWindowsRefusesJunction \
            TestWindowsDanglingSymlinkNotFollowed \
            TestWindowsDanglingSymlinkNotFollowed/key \
            TestWindowsDanglingSymlinkNotFollowed/pub \
            TestWindowsDanglingSymlinkNotFollowed/log \
            TestNewWriterWindowsHardLinkKeepsDACL \
            TestNewWriterWindowsBrokenChainKeepsDACL \
            TestNewWriterWindowsRefusesOtherOwner; do
            if ! grep -qF -- "--- PASS: $t (" audit-windows.log; then
              echo "::error::$t did not print --- PASS"
              missing=1
            fi
          done
          exit "$missing"

  lint:
    name: golangci-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache: true
      - uses: golangci/golangci-lint-action@9fae48acfc02a90574d7c304a1758ef9895495fa # v7.0.1
        with:
          # Must be built with a Go at least as new as the go.mod toolchain
          # minor, or it refuses to run ("the Go language version (go1.25)
          # used to build golangci-lint is lower than the targeted Go
          # version"). v2.9.0 is the first release built with Go 1.26
          # (go1.26.0, commit 72798d34); v2.8.0 is built with go1.25.5.
          version: v2.9.0

  vuln:
    name: govulncheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache: true
      # `make vulncheck` runs golang.org/x/vuln/cmd/govulncheck at the version
      # pinned in the Makefile (GOVULNCHECK_VERSION) via `go run pkg@version`,
      # so go.mod and go.sum stay unchanged. govulncheck exits 3 when a
      # vulnerability is reachable from our code (stdlib included); `go run`
      # reports that as exit 1, which fails the job. Findings only in required
      # modules that no symbol reaches are printed and exit 0.
      - name: govulncheck ./...
        run: make vulncheck

  actionlint:
    name: actionlint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache: true
      # `make actionlint` runs github.com/rhysd/actionlint at the version pinned
      # in the Makefile (ACTIONLINT_VERSION) via `go run pkg@version`, with
      # .github/actionlint.yaml for the self-hosted `clab` label. shellcheck is
      # preinstalled on ubuntu-latest, so `run:` scripts are checked too. A
      # broken workflow file fails its pull request instead of main (T0.9).
      - name: actionlint .github/workflows
        run: make actionlint

  python:
    name: policy-lint smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
      - name: unit tests (tier 1)
        working-directory: tests
        run: uv run --extra dev pytest unit -q
      - name: lint every shipped policy
        working-directory: tests
        run: |
          for f in ../policies/examples/*.yaml; do
            case "$f" in *.test.yaml) continue;; esac
            uv run python -m policy_lint "$f"
          done

  status:
    name: STATUS.md is current
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      - name: board and STATUS.md agree
        run: python3 tools/status/render.py --check
