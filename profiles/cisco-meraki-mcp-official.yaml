# Profile for the official Cisco Meraki MCP server (Python 3.14, FastMCP 3,
# stdio or HTTP). Board task M1-17, test-matrix row 18. Research brief 02
# section 1.10 and shape 7: a meta-tool, execute_api(capability_id,
# parameters), where the name carries no semantics and capability_id chooses
# the operation, so the class comes from the capability table below
# (ADR 0010; profile-schema section 3; classification.md section 2).
#
# Pinned upstream: commit c1d00eaf8f4455ccb6bf5ffdc0189fe0f40b1a5b
# (2026-07-28, "Initial public release", upstream HEAD on 2026-09-25; package
# version 0.1.0; no tags). Verified [src] in:
#   https://github.com/CiscoDevNet/cisco-meraki-mcp-official/blob/c1d00eaf8f4455ccb6bf5ffdc0189fe0f40b1a5b/cisco_meraki_mcp/tools/execute_api.py
#   .../cisco_meraki_mcp/tools/semantic_search.py
#   .../cisco_meraki_mcp/providers/openapi.py
#   .../cisco_meraki_mcp/providers/request_validation.py
#   .../cisco_meraki_mcp/providers/meraki_client.py
#   .../cisco_meraki_mcp/specs/meraki.json.gz (Meraki Dashboard API 1.70.0;
#   file sha256 23292fc813e6878c346f8bc7ac5248e78295bab2ef247d545a27b85c9f653631,
#   the decompressed JSON 825276cf08ade49202beb97c446725e48601a599082135e384edb2e6a0de8a64
#   as specs/meraki.json.sha256 records it)
# The tools, their arguments and the capability ids are in the tier 1 fixture
# tests/fixtures/meraki/ (tools-list.json is the upstream's own tools/list;
# capabilities.tsv its capability set), generated from the upstream's code by
# tests/fixtures/meraki/generate.py.
#
# How execute_api picks the operation [src execute_api.py:230-296]:
# store.endpoint_for(capability_id) is a plain dict lookup (vector_store.py
# :154, 166-168) keyed by the OpenAPI operationId of every non-deprecated GET
# operation in the bundled spec (openapi.py collect_get_operations): 494 ids
# at this commit. An id not in it returns "Capability not found". The call
# then runs getattr(<SDK resource group>, capability_id) (meraki_client.py
# :119-146) and require_get_operation refuses an SDK method whose name does
# not start with "get" (request_validation.py:51-69). So upstream, a call can
# only reach a GET operation. fathomgate does not rely on either check: the
# upstream is untrusted (invariant 7), a later version or a replaced spec
# file (initialize_vector_store takes a spec_path) can index other
# operations, and anything this table does not list is EXEC_ARBITRARY.
#
# The capability table. One row per id the upstream indexes, except
# clipDeviceCamera, a GET whose name does not start with "get" and which the
# upstream therefore refuses at run time; it is left out, so it is
# EXEC_ARBITRARY. The class follows the spec's own category tag, with eight
# exceptions marked on their rows:
# - configure (334 ids; 328 here): READ_CONFIG. These return configuration,
#   and several carry secrets: SSID pre-shared keys and RADIUS secrets
#   (getNetworkWirelessSsids), SNMP communities (getNetworkSnmp), site-to-site
#   VPN secrets, webhook shared secrets, the Systems Manager enrolment string
#   (getNetwork, getOrganizationNetworks). A policy should attach the redact
#   obligation to READ_CONFIG. Redaction does not cover these yet: the
#   secrets are JSON values under Meraki keys ({"psk": ...}), which the
#   current redactor does not match, and Meraki JSON patterns are an M2
#   redaction task (threat model, "Meraki parameters scope and JSON-keyed
#   secret redaction").
# - monitor (150 ids; 147 here) and liveTools (10): READ_OPERATIONAL. Status,
#   statistics, events, clients, and the results of a live tool that a POST
#   (not reachable here) started.
# - INVENTORY_READ (6, from configure): getOrganizations, getOrganization,
#   getOrganizationDevices, getDevice, getOrganizationInventoryDevices and
#   getOrganizationInventoryDevice, the organisation and device lists and
#   records, which name devices and hold no credential. getNetwork and
#   getOrganizationNetworks stay READ_CONFIG: each network carries its
#   enrollmentString, the Systems Manager enrolment secret (security review
#   of PR #196, F1).
# - READ_CONFIG (2, from monitor): getOrganizationConfigurationChanges
#   returns the old and new value of every change, secrets included, and
#   getOrganizationWebhooksLogs returns webhook payloads, which carry the
#   receiver's shared secret.
# TestMerakiCapabilityTable (internal/classify) holds the table to this rule
# and to capabilities.tsv: a new upstream id fails the test until it has a
# row here.
#
# Argument list (ADR 0033). execute_api names capability_id (its
# capability_param) and refuses parameters. parameters is an object whose
# keys the upstream passes to the Meraki SDK method as keyword arguments
# (execute_api.py:174): the organisation, network or device serial the
# read is scoped to, and query options. ADR 0033 section 2 keeps such an
# argument unnamed until the schema can describe it, so a call that carries
# parameters is denied with default:bad_arguments, and fathomgate removes it
# from the inputSchema it advertises (not required upstream). At this commit
# 4 of the 493 listed capabilities need no parameter (getOrganizations,
# getAdministeredIdentitiesMe, getAdministeredIdentitiesMeApiKeys,
# getAdministeredLicensingSubscriptionEntitlements); the rest are unusable
# through fathomgate until a decision record says how parameters is checked.
#
# Other facts the proxy cannot see [src]:
# - One API key per process: MERAKI_DASHBOARD_API_KEY on stdio, or the
#   agent's Authorization bearer header over the upstream's own HTTP
#   transport (meraki_credentials.py). fathomgate runs it over stdio, so the
#   key is the operator's, and every organisation that key can read is in
#   reach. Give it a read-only Dashboard API key, as the upstream README says.
# - Annotations: execute_api says readOnlyHint true. It is untrusted and
#   never lowers a class (invariant 3); an unlisted capability stays
#   EXEC_ARBITRARY whatever the hint says.
# - There is no device target: the Meraki cloud is the one controller behind
#   the key. The organisation, network or serial is inside parameters. Target
#   rules, max_devices and unknown_target do not apply to these calls
#   (implicit_target, profile-schema section 3, is M5).
# - semantic_search is a local vector search over the same bundled spec
#   (fastembed model, downloaded at first start); it calls no Meraki API.
server: cisco-meraki-mcp-official
source: https://github.com/CiscoDevNet/cisco-meraki-mcp-official
description: Official Cisco Meraki server; a search tool and one meta-tool, execute_api(capability_id), over the Dashboard API GET operations
tools:
  semantic_search:
    class: INVENTORY_READ
    args: [query, top_k]
    notes: >-
      [src semantic_search.py:94-140] query: str (required), top_k: int 1-20
      (default 5). Ranks the capability catalog by a local embedding search
      and returns capability ids with their summaries; no Meraki API call.
  execute_api:
    class: EXEC_ARBITRARY
    capability_param: capability_id
    capability_table: dashboard
    args: []
    refused_args: [parameters]
    notes: >-
      [src execute_api.py:230-296] capability_id: str (required), parameters:
      dict[str, str | int | bool] | None. Meta-tool: the class of a call is
      the dashboard table's class for its capability_id, byte for byte;
      any other id, a missing one, or one that is not a string is
      EXEC_ARBITRARY. parameters is refused (header, ADR 0033).
