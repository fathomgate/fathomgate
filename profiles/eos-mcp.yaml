# Profile for shigechika/eos-mcp (Python FastMCP, stdio, Arista eAPI).
# Source: docs/research/02-network-mcp-servers.md §1.5, each tool re-checked
# against its handler at the pinned tag below (M1-14).
#
# Exemplary two-phase config push (dry-run by default, configure session with
# commit timer) next to an unrestricted run_command* family that the README
# itself calls a second write path. Batch tools select devices by hostnames
# and/or tags; tags become "@tag" group tokens for the inventory to expand.
#
# Pinned upstream: v1.3.0 (PyPI eos-mcp 1.3.0, uploaded 2026-08-15; the
# newest tag and release on 2026-09-25), commit
# bffb89377b3fa6b544b45b0cab44d5191cf8981a. Its uv.lock resolves pyeapi 1.0.4
# (pyproject.toml asks for any pyeapi). Verified [src] in:
#   https://github.com/shigechika/eos-mcp/blob/bffb89377b3fa6b544b45b0cab44d5191cf8981a/eos_mcp/server.py
#   (and eos_mcp/eapi.py, eos_mcp/config.py at the same commit)
# Line numbers below are at that commit.
#
# Tools [src]. server.py registers exactly 17 tools with @mcp.tool() (FastMCP
# from the official SDK, `mcp>=1.2,<2`); the argument names are the Python
# parameter names. Every tool also takes config_path: str = "" (see hazard 2).
# Argument list (ADR 0033): every parameter below is named in a *_params list
# or in args, except config_path and session_name, which are in refused_args
# and are denied when sent (hazards 2 and 3).
#   health_check            server.py:53-109   config_path
#   get_router_list         112-126            tags, config_path
#   get_device_facts        129-160            hostname
#   get_device_facts_batch  163-209            hostnames, tags, max_workers=5
#   get_version             212-222            hostname
#   get_config_diff         225-239            hostname, rollback_id=1
#   list_config_sessions    242-254            hostname
#   run_command             257-265            hostname, command
#   run_commands            268-276            hostname, commands
#   run_command_batch       279-320            command, hostnames, tags, max_workers=5
#   run_commands_batch      323-365            commands, hostnames, tags, max_workers=5
#   get_config              368-376            hostname
#   push_config             379-411            hostname, config_lines, session_name="mcp-push",
#                                              dry_run=True, commit_timer=300
#   confirm_config_session  414-426            hostname, session_name="mcp-push"
#   abort_config_session    429-441            hostname, session_name="mcp-push"
#   collect_tech_support    444-452            hostname
#   daily_brief             455-553            hostnames, tags, max_workers=5, since_hours=24
# What each sends over eAPI runCmds (eapi.py): run_command and _batch send
# [command] (94-97); run_commands and _batch send the list as given (100-104);
# get_config sends "show running-config" (107-109); get_config_diff "show
# rollback config <n>" then "show running-config diffs" (187-207);
# list_config_sessions "show configuration sessions detail" (210-212);
# collect_tech_support "show tech-support" (158-160); push_config
# ["configure session <name>", *config_lines, "show session-config diffs",
# "abort" | "commit timer hh:mm:ss"] in one call (118-143); confirm and abort
# "configure session <name> commit|abort" (146-155); get_version and
# get_device_facts "show version" (+ "show hostname"); daily_brief
# (check_health, eapi.py:368-480) only show commands: version, hostname,
# clock, logging, environment, interfaces status, mlag.
#
# Separators (M1-14, for the PR #152 security review). Nothing splits a
# command string on commas or newlines. `pyeapi.connect` without return_node
# returns an EapiConnection (pyeapi 1.0.4 client.py:394-461), whose execute()
# puts each list element into the JSON-RPC `cmds` array unchanged
# (eapilib.py:306-359, 596-634); a string command is one element
# (make_iterable). The `MULTILINE:` split in pyeapi Node.run_commands
# (client.py:884-891) is not on this path. So "show version,reload" reaches
# EOS as one command, which the EOS parser rejects as one command. How eAPI
# treats an embedded newline inside one `cmds` element is not recoverable
# from source (uncertain); fathomgate must refuse it before it gets there,
# as the M1-16 classifier does.
#
# Hazards [src] (for the security reviewer; M1-14 handoff):
# 1. hostname is free-form, not an inventory name. get_creds uses
#    cfg.get(host, ..., fallback=...), and configparser's fallback also
#    covers a missing section (config.py:62-70), so any hostname connects,
#    with the [DEFAULT] username and password (server.py:26-30). The eAPI
#    credentials therefore go to whatever host the agent names, over HTTPS
#    with the device certificate never checked. config.ini has a `verify`
#    key (default false, config.py:69), and eos_mcp.eapi.get_node passes it
#    as verify= to pyeapi.connect, but pyeapi 1.0.4 drops that keyword and
#    HttpsEapiConnection builds ssl._create_unverified_context() whenever no
#    context is given, so `verify = true` changes nothing; and
#    eos_mcp/eapi.py:13-27 patches ssl._create_unverified_context
#    process-wide to SECLEVEL=0 and a TLS 1.0 minimum. Shown on the real
#    upstream by tier 2 (tests/integration/test_eos_mcp.py,
#    test_passthrough_verify_true_is_not_enforced, M1-22): with
#    `verify = true` the call to a self-signed fake device succeeds. There is
#    no setting that makes eos-mcp 1.3.0 check the device. The controls are
#    in front of it: fathomgate's inventory with the default:unknown_target
#    deny (a host the agent names that is not in inventory never gets the
#    credentials) and the refused config_path (hazard 2), plus a trusted
#    network path to the devices. Brief 02 said the hostname "must exist in
#    config.ini"; it does not.
# 2. config_path is a local file read (critical once policy is enforced).
#    Every tool takes an agent-supplied file path (server.py:22-23,
#    config.py:20-43) and hands configparser's error text back to the agent:
#    health_check as `detail` (server.py:100-107), get_router_list as an MCP
#    tool error because it catches only FileNotFoundError (115-118), and the
#    rest as "Error (<host>): <e>". configparser quotes the offending lines
#    (reproduced; security review of PR #158, P1):
#    - a file with no [section] header gets its first line quoted, so every
#      single-line secret file is returned whole: ~/.git-credentials,
#      .pgpass, .env, ~/.netrc, the --listen-token-file file;
#    - a file that starts with a [section] line gets every malformed line
#      after it quoted;
#    - /proc/<pid>/environ is one NUL-separated line, so /proc/self/stat
#      (parent pid) then /proc/<ppid>/environ returns fathomgate's whole
#      environment: FATHOMGATE_LISTEN_TOKEN and every --upstream-env-pass
#      credential.
#    It also swaps the inventory: credentials, transport and verify for that
#    call come from a file the agent chose.
#    Refused (M1-35, ADR 0033): no tool names config_path, so a call that
#    carries it, with any value including "" and null, is denied with
#    default:bad_arguments once the gate is wired (M1-18, M1-19); every tool
#    lists it under refused_args. Until the gate enforces it (v0.1.0 serve
#    forwards everything), put a `deny` rule with `servers: [eos-mcp]` first
#    in the policy, or run eos-mcp sandboxed so it can read only its own
#    config.ini and not fathomgate's /proc entries or files. Do not rely on
#    `verify = true` in config.ini: eos-mcp 1.3.0 does not enforce it
#    (hazard 1).
# 3. push_config's dry_run is not a sandbox. config_lines go into the eAPI
#    call unfiltered after "configure session <name>", so a line such as
#    "end" followed by "configure" or an exec command would run outside the
#    session before the final "abort" (eapi.py:133-135; EOS behaviour not
#    tried on a device, uncertain). session_name and commit_timer are
#    interpolated unchecked (eapi.py:112-115, 133-134). commit_timer is an
#    int that FastMCP validates; session_name is free text, so it is not
#    named (refused_args, ADR 0033) and every session is the default
#    "mcp-push". The class is
#    WRITE_CONFIG whatever dry_run says. A future M3 dry_run driver must never
#    use the upstream's push_config dry_run=True: it sends the payload to the
#    device, before any approval. Since M1-36 fathomgate checks every line
#    of config_lines (classification.md section 11, CLI union list): a
#    control or non-ASCII byte, or a first word such as end, exit,
#    configure, commit, abort, do, reload, bash or show, makes the call
#    EXEC_ARBITRARY. Tier 2 on cEOS (M1-28) is to prove the device
#    behaviour.
# 4. daily_brief with neither hostnames nor tags runs on every device in
#    config.ini (server.py:476-478), and fathomgate sees zero targets. The
#    other batch tools do not: with an empty selection they return "No hosts
#    resolved" (296-298, 341-343, 176-178).
# 5. Connections are cached per hostname for the life of the process
#    (eapi.py:29-31, 65-82), so a config_path given later for a cached host
#    is ignored until a call to it fails.
server: eos-mcp
source: https://github.com/shigechika/eos-mcp
description: Arista EOS server over eAPI with config sessions
tools:
  health_check:
    class: LOCAL_ADMIN
    args: []
    refused_args: [config_path]
    notes: Parses the server's own config.ini (or the agent's config_path), no device connection; its error detail echoes file content (header, hazard 2).
  get_router_list:
    class: INVENTORY_READ
    group_params: [tags]
    args: []
    refused_args: [config_path]
  get_device_facts:
    class: READ_OPERATIONAL
    target_params: [hostname]
    args: []
    refused_args: [config_path]
  get_version:
    class: READ_OPERATIONAL
    target_params: [hostname]
    args: []
    refused_args: [config_path]
  get_device_facts_batch:
    class: READ_OPERATIONAL
    targets_params: [hostnames]
    group_params: [tags]
    args: [max_workers]
    refused_args: [config_path]
  run_command:
    class: EXEC_ARBITRARY
    target_params: [hostname]
    command_params: [command]
    args: []
    refused_args: [config_path]
    notes: Verbatim pass-through to eAPI, including configure and reload.
  run_commands:
    class: EXEC_ARBITRARY
    target_params: [hostname]
    command_params: [commands]
    args: []
    refused_args: [config_path]
    notes: The list is sent as one eAPI runCmds call, so ["configure", "hostname x"] is a config write.
  run_command_batch:
    class: EXEC_ARBITRARY
    targets_params: [hostnames]
    group_params: [tags]
    command_params: [command]
    args: [max_workers]
    refused_args: [config_path]
    notes: Fleet-wide over hostnames plus every device with a matching tag; an empty selection runs nothing upstream (server.py:296-298).
  run_commands_batch:
    class: EXEC_ARBITRARY
    targets_params: [hostnames]
    group_params: [tags]
    command_params: [commands]
    args: [max_workers]
    refused_args: [config_path]
    notes: As run_command_batch, with a list of commands per device.
  get_config:
    class: READ_CONFIG
    target_params: [hostname]
    args: []
    refused_args: [config_path]
  get_config_diff:
    class: READ_CONFIG
    target_params: [hostname]
    args: [rollback_id]
    refused_args: [config_path]
  list_config_sessions:
    class: READ_CONFIG
    target_params: [hostname]
    args: []
    refused_args: [config_path]
  push_config:
    class: WRITE_CONFIG
    target_params: [hostname]
    config_params: [config_lines]
    args: [dry_run, commit_timer]
    refused_args: [session_name, config_path]
    notes: dry_run defaults to true; commit_timer (default 300s) requires confirm_config_session. dry_run is not a sandbox (header, hazard 3).
  confirm_config_session:
    class: WRITE_CONFIG
    target_params: [hostname]
    args: []
    refused_args: [session_name, config_path]
    notes: Finalises a pending session; treated as a write because it makes the change permanent.
  abort_config_session:
    class: WRITE_CONFIG
    target_params: [hostname]
    args: []
    refused_args: [session_name, config_path]
    notes: Rollback of a pending session; still a state change on the device.
  collect_tech_support:
    class: READ_CONFIG
    target_params: [hostname]
    args: []
    refused_args: [config_path]
    notes: Sends "show tech-support" (eapi.py:158-160), whose output includes the running-config, so it is READ_CONFIG like the same command through run_command (M1-14; was READ_OPERATIONAL). Heavy, 30 seconds or more.
  daily_brief:
    class: READ_OPERATIONAL
    targets_params: [hostnames]
    group_params: [tags]
    args: [max_workers, since_hours]
    refused_args: [config_path]
    notes: With neither hostnames nor tags it runs on every configured device and fathomgate sees zero targets (server.py:476-478).
