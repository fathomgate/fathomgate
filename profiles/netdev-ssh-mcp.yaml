# Profile for krisiasty/netdev-ssh-mcp (Go, stdio, multi-vendor SSH).
# Source of tool names and parameters: docs/research/02-network-mcp-servers.md §1.1,
# each one re-checked against the handler at v1.7.1 (M1-14, below).
#
# Audit M1-14 (2026-09-25). Every row below re-read [src] at tag v1.7.1,
# commit 6fc6ab0aed1e84b8dd71b1bf1ad39cd909146623, under
# https://github.com/krisiasty/netdev-ssh-mcp/blob/6fc6ab0aed1e84b8dd71b1bf1ad39cd909146623/
# The server registers exactly five tools (main.go:84-145), all with
# go-sdk mcp.AddTool and typed input structs, so the JSON names are the
# struct tags:
#   get_config        config.go:14-20       host, username, port, config_type, device_type
#                     sends only "show <running|startup>-config | no-more",
#                     "show configuration | no-more" (junos) or
#                     "show full-configuration" (fortios), device_type.go:63-78.
#   run_show_command  show.go:13-19         host, command, username, port, device_type
#                     one SSH exec request with the checked string,
#                     device_type.go:80-120, command_safety.go:75-109.
#   run_ping          ping.go:14-26         host, destination, username, port, count,
#                     timeout, source, vrf, size, outgoing_interface, device_type
#   run_traceroute    traceroute.go:14-26   host, destination, username, port, max_hops,
#                     timeout, probe, source, vrf, outgoing_interface, device_type
#   trust_host_key    hostkey.go:14-20      host, port, confirm, replace_existing;
#                     confirm=false only reads the key (hostkey.go:35-51);
#                     confirm=true writes known_hosts (sshclient/client.go:397-429).
# No tool, class or target/command parameter name differs from this profile.
#
# Argument list (M1-35, ADR 0033), read from the same struct tags. Every
# parameter above is named in target_params, command_params or args, except
# username, which is in refused_args and denied when sent. username picks
# the device account the server's SSH credentials log in as (show.go:26-31,
# config.go:27-32), so an agent could move from the operator's read account
# to another account the same key or password opens. Set DEVICE_USERNAME
# in the upstream's environment instead; the server falls back to it. port
# is named: go-sdk marks it required (no omitempty), and the host it
# connects to is still the one policy checked.
#
# Separators (M1-14, for the PR #152 security review). No code path splits a
# command on commas: run_show_command passes the checked string whole to
# sshclient.RunCommand, one session.Output(cmd) (sshclient/client.go:102-107,
# 162). So "show version,reload" reaches the device as one command, which
# the device parses as one (EOS, IOS, NX-OS and Junos have no comma
# separator; not tried on a device). Newlines never reach the device from a
# caller: checkOperationalCommand refuses any control character and U+2028,
# U+2029 (command_safety.go:76-80), and ';' (81-84). The only multi-line exec
# is RunCommands (client.go:110-127), used for FortiOS ping and traceroute
# with server-built lines (device_type.go:126-151, 197-221).
#
# Leading '-' in run_ping / run_traceroute (T0.53, decided in M1-14). The
# destination, source, vrf and outgoing_interface pattern
# [A-Za-z0-9._:/@%-]{1,255} (command_safety.go:19-33) allows a leading '-',
# so a value can land in the device command as an option word (for example
# "ping -f"). Whitespace is refused, so it is at most one word per argument.
# Decision: both tools stay READ_OPERATIONAL. The worst outcome is a ping or
# traceroute that runs with a vendor option (more packets, a longer run),
# not a state change; the command verb is fixed by the server. Fathomgate
# does not rely on the upstream check for this: the profile names these
# arguments in args (ADR 0033), which lets them through without reading
# their values, so today nothing in fathomgate checks them either. Refusing
# a leading '-' in fathomgate needs a per-argument pattern in the profile
# schema, which it does not have (proposed to policy-engineer in the M1-14
# handoff). Which vendor CLIs accept a dash option here is not recoverable
# from the source (uncertain).
#
# The server is read-only by design. It redirects config dumps to get_config.
# Since v1.7.0 it obfuscates secrets with a keyed hash, and since v1.7.1 it
# refuses run_show_command input that is not a single show/get command with
# allow-listed pipes (see below). Its `host` parameter is free-form with no
# inventory, so the proxy's contribution here is the host allow-list (unknown
# targets) and defence-in-depth command checking.
# Gaps left at v1.7.1 [src, internal/netdev/device_type.go, command_safety.go]:
# the get_config redirect is a plain prefix check ("show ru", "show sta"), so
# `show  running-config` (two spaces) passes it and runs through
# run_show_command (the output is still obfuscated); and the run_ping /
# run_traceroute argument pattern allows a leading `-`, so a destination,
# source, vrf or interface can start with `-`. Fathomgate's own
# classification (M1) must cover both.
#
# Pinned upstream: v1.7.1 (tier 2, CI job client-smoke; T0.51, 2026-09-25).
# Verified [src] at tag v1.7.1, commit 6fc6ab0aed1e84b8dd71b1bf1ad39cd909146623:
#   https://github.com/krisiasty/netdev-ssh-mcp/blob/6fc6ab0aed1e84b8dd71b1bf1ad39cd909146623/internal/netdev/obfuscate.go
#   (and obfuscation_key.go, command_safety.go, main.go)
# - GHSA-8g43-jrf3-q9vq (fixed in v1.7.0, PR #22, commit 682e2e1; the T0.29
#   report below, reporter credited):
#   https://github.com/krisiasty/netdev-ssh-mcp/security/advisories/GHSA-8g43-jrf3-q9vq
#   Tokens keep the [h:<12 hex>] shape but are HMAC-SHA256 truncated to 48
#   bits, under k = HMAC-SHA256(raw, "netdev-ssh-mcp/obfuscation/v1"). raw is
#   OBFUSCATION_KEY or the file named by --obfuscation-key-file /
#   OBFUSCATION_KEY_FILE (only one; at least 16 bytes; otherwise exit 1). With
#   neither, a random per-run key: the server sets MCP `instructions` (which
#   fathomgate does not relay) and appends a second text content block, a
#   notice, to each get_config / run_show_command result holding a token.
#   If the server ever reaches obfuscation with no key loaded (an internal
#   fault, not a setting), it returns an error instead of the output. Every pattern runs on every
#   line and type words (7, md5 7, sha512) are skipped, so all T0.29 misses
#   are fixed: run over tests/fixtures/configs/ with trailing rule annotations
#   stripped, 0/71 secrets left in clear (v1.6.6 as control: 20/71, the T0.29
#   totals). As committed, 3 ios-xe lines still show in clear because
#   end-of-line-anchored patterns meet the annotation; a real device prints no
#   such annotation.
# - GHSA-h47r-329w-6p9h (fixed in v1.7.1, PR #23, commit ce2206b; reported by
#   the upstream maintainer):
#   https://github.com/krisiasty/netdev-ssh-mcp/security/advisories/GHSA-h47r-329w-6p9h
#   run_show_command: one line, no control characters, no ';', no '<' '>',
#   first word show (get on FortiOS), pipes from a per-platform allow-list.
#   run_ping / run_traceroute: destination, source, vrf, outgoing_interface
#   match [A-Za-z0-9._:/@%-]{1,255}. Refusals are tool errors; nothing is sent.
# - Tool names, parameters and go-sdk (v1.8.0, 2026-07-28) are unchanged from
#   v1.6.6.
# - Still NOT a Fathomgate control. The tokens are keyed under the upstream's
#   key, not Fathomgate's, and cover only line shapes the upstream knows. The
#   proxy's redactor (M2, row 15) runs on every result and must not treat a
#   line holding an [h:...] token as clean. The command checks are defence in
#   depth under Fathomgate's own classification (M1), which must not rely on
#   them. Install docs: keep obfuscation on, with the default per-run key; a
#   key file is optional, only for tokens that must match across runs, and
#   must be kept where the agent's tools cannot read it.
#
# History. Upstream secret obfuscation is NOT a redaction control (T0.29, 2026-09-23).
# Verified [src] at tag v1.6.6, commit be3e36342b0c71007ce416a435dfdfecc966ea13:
#   https://github.com/krisiasty/netdev-ssh-mcp/blob/be3e36342b0c71007ce416a435dfdfecc966ea13/internal/netdev/obfuscate.go
#   (called from internal/netdev/show.go and config.go; --no-obfuscate in main.go)
# - get_config and run_show_command output passes through obfuscateConfig,
#   which replaces the value captured by the first matching line regex with
#   "[h:" + hex(sha256(value)[:6]) + "]". run_ping, run_traceroute and error
#   strings are not obfuscated. On by default; --no-obfuscate turns it off.
# - The hash is unkeyed, so a word list recovers short values offline:
#   public -> [h:efa1f375d761], private -> [h:715dc8493c36]. This does not meet
#   Fathomgate invariant 4 (keyed HMAC tokens); Fathomgate must not rely on it or
#   count it as redaction. The proxy's own redactor (M2, matrix row 15) runs
#   on every result regardless and must not treat a line holding an [h:...]
#   token as already clean (see the wrong-token cases below).
# - Several patterns capture the wrong token, so the secret stays in clear
#   next to a hash of a keyword. Run against tests/fixtures/configs/:
#     username X ... secret sha512 <hash>          hashes "sha512" (EOS default)
#     ntp authentication-key N md5 7 <key>         hashes "7"
#     ip ospf message-digest-key N md5 7 <key>     hashes "7"
#     key-string 7 <key>                           hashes "7"
#     pre-shared-key ascii-text "<key>" (Junos)    hashes "ascii-text"
#   and these are missed entirely: snmp-server host ... <community>,
#   NX-OS radius-server host ... key 7 "<key>", NX-OS snmp-server user ...
#   priv <key>, Junos tacplus/radius secret "...", Junos set-format lines.
#   Fixture totals missed: eos 5/13, ios-xe 3/22, nxos 5/13, junos 7/13,
#   eos-4.16 0/4, fortios 0/6. No upstream unit tests cover obfuscation.
# - Install docs recommend leaving obfuscation ON in M0 (defence in depth
#   while Fathomgate does not redact). Revisit once M2 redaction ships.
#   (The T0.29 findings are fixed upstream in v1.7.0, GHSA-8g43-jrf3-q9vq;
#   see the section above.)
server: netdev-ssh-mcp
source: https://github.com/krisiasty/netdev-ssh-mcp
description: Read-only multi-vendor SSH server (EOS, IOS/IOS-XE, NX-OS, Junos, FortiOS)
tools:
  get_config:
    class: READ_CONFIG
    target_params: [host]
    args: [port, config_type, device_type]
    refused_args: [username]
    notes: config_type running|startup; output is obfuscated server-side, redacted again by the proxy.
  run_show_command:
    class: READ_OPERATIONAL
    target_params: [host]
    command_params: [command]
    args: [port, device_type]
    refused_args: [username]
    notes: Server (v1.7.1) accepts one show/get command with allow-listed pipes; the proxy re-checks and escalates config dumps to READ_CONFIG.
  run_ping:
    class: READ_OPERATIONAL
    target_params: [host]
    args: [destination, port, count, timeout, source, vrf, size, outgoing_interface, device_type]
    refused_args: [username]
    notes: destination, count, timeout, source, vrf, size, outgoing_interface are typed args, not commands (string args character-checked upstream since v1.7.1). A leading '-' passes the upstream check; class kept, see the header (M1-14).
  run_traceroute:
    class: READ_OPERATIONAL
    target_params: [host]
    args: [destination, port, max_hops, timeout, probe, source, vrf, outgoing_interface, device_type]
    refused_args: [username]
    notes: Same argument check and leading '-' note as run_ping.
  trust_host_key:
    class: LOCAL_ADMIN
    target_params: [host]
    args: [port, confirm, replace_existing]
    notes: Writes known_hosts on the MCP server host, not on the device. Two-step confirm flow.
