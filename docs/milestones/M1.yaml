servers). Each decision is checked as the exact tool error and the decision line. make policy-test: 45 of 45 passed. Conformance leg fathomgate-policy (tests/conformance/policy/, a test profile for the fixture, new baselines): tools-call-error scores the deny tool error, and http-custom-header-server-validation passes on the narrowed schema. Row 6 audit half waits for M4 (M1-24). Blocked, not run: the cEOS checks and the vMX/cRPD check (licensed images, no tier 3 runner); moved to M3 by the maintainer 2026-09-25, so M1-28 no longer waits on them. Exit criteria not ticked here. Scope added by the coordinator: row 5 M1 half (PR #194 split the row). show running-config in four whitespace variants through upa send_command_and_get_output and eos-mcp run_command is READ_CONFIG class_source reclassify, allowed under read-only and denied by no-config-reads with nothing forwarded; green in run 36201094163 at bae1f6d (rows 3, 4 and 6 green again there). Row 5 text is left for PR #194; the matrix run notes say what it should read. Round 2 (security review of PR #195, approved; L1-L4 and nits): upa core-x in upa''s TOML, --no-policy reload control, policy_prompts.py ties the seven MRTR baseline entries to the policy refusal, regex slog parsing, threat-model N1 row and M1-28 evidence. Merged in PR #195 2026-09-25 after two security rounds: rows 3, 4 and 6 passing, row 5 passing for its M1 half. cEOS/vMX device checks moved to M3 by the maintainer.'
