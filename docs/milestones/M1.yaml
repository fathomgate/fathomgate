    adr: "0016"
    matrix: [23]
    notes: 'Carried from T0.58. M1 follow-up from N3 in the security re-review of PR #121 (T0.57). A DELETE does not retire the session, so a tools/call go-sdk delivered before it but that admit had not yet let through runs after the DELETE''s cancelSession; go-sdk''s serveStatefulDELETE closes the session synchronously and waits for that call, and the idle expiry cancels it after SessionTimeout (30 min). That residual is accepted for M0 (threat model row 34, TestDeleteWindowBoundedByIdleExpiry). Retiring on DELETE was not done because go-sdk can still refuse the DELETE (400 on a bad header) after fathomgate has retired a live session. Revisit once per-call deadlines and WRITE_CONFIG enforcement exist: either fathomgate pre-checks what go-sdk checks on DELETE before retiring, or a go-sdk hook runs after its checks pass. Kickoff 2026-09-25: WRITE_CONFIG enforcement arrives with M1-19. No board task yet adds per-call deadlines, so the revisit starts from M1-19 and records whether deadlines are still needed. Moved to M3 by the maintainer 2026-09-25, to be fixed with approvals and per-call deadlines, when a call admitted after a DELETE could be an approved write. Until then the residual stays accepted and bounded by the idle expiry (threat model row, TestDeleteWindowBoundedByIdleExpiry).'
