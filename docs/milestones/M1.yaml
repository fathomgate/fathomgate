  - id: M1-09
    title: Check the audit signing key like every other secret file, and stop audit verify trusting a private key
    package: internal/audit
    owner: policy-engineer
    reviewers: [security-reviewer, go-reviewer]
    state: merged
    adr: "0028"
    matrix: []
    spec: docs/specs/audit-event-schema.md
    notes: 'Carried from T0.55. From the security review of PR #112 (medium, predates it, MCP08). audit.LoadKey (internal/audit/key.go:138) calls os.ReadFile: it follows symbolic links and checks no owner, mode, link count, Windows DACL or macOS ACL. LoadPublicKey (key.go:160-173) accepts a private key file and derives the public key from it, so audit verify --key <signing key> trusts the file the signer uses. Latent: nothing signs in production until M1 wires serve --audit. Fix: open the key like openExistingLog and readTokenFile (O_NOFOLLOW, regular file, one link, owned by the current user, 0600 or 0400, fileacl.Extended, protected DACL on Windows), and make verify refuse a private key as its trust anchor. Needs a short ADR on key custody (also PLAN.md open question on key custody). Blocks the M1 task that wires --audit. Kickoff 2026-09-25: The key-custody record is ADR 0028 (M1-03). ADR 0027 keeps serve --audit refused until M4, so this blocks the M4 --audit wiring, not an M1 task. PR #155 2026-09-25: new internal/secretfile (token files and audit key share one checker: no links, one link, owner, 0600/0400, macOS ACL, Windows protected DACL, SQOS); LoadPublicKey refuses any file containing PRIVATE KEY and non-regular files. Security approved round 1 with lows, Go requested process fixes; fix round in re-review. Merged in PR #155 2026-09-25 (internal/secretfile; LoadPublicKey refuses private keys; security and Go approved after two rounds).'
