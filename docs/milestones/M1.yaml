    notes: 'Carried from T0.53. From the security review of PR #108 (T0.51). Rows to add: upstream text addressed to the agent inside tool results (Open until M2 labelling of every content block); upstream instructions are not relayed (mitigated, pinned by the T0.51 test); an upstream obfuscation key readable by the agent (documented); whitespace variants such as show  running-config dodge netdev-ssh-mcp config-dump detection (M1 classify must collapse whitespace; add a tier 1 case); leading-dash arguments to run_ping and run_traceroute (upstream-server-scout); upstream tool description changes on version bump (M2 row 16 needs a re-pin workflow). Also: gitleaks is not in CI. Also from the security review of PR #111 (N5): on Windows an upstream can open Fathomgate''s own process with at least PROCESS_CREATE_PROCESS and PROCESS_DUP_HANDLE, and probably PROCESS_VM_READ, which could read other upstreams'' secrets from Fathomgate''s memory; give it its own row and consider a restrictive process DACL. Kickoff 2026-09-25: The whitespace tier 1 case is now in M1-16 and the run_ping and run_traceroute leading dash in M1-14. PR #194 2026-09-25 (written by docs-writer): seven rows added with status and owner - upstream text in tool results (open, mcp-protocol-engineer, M2 content-block labels), upstream instructions (mitigated, T0.51), a readable upstream obfuscation key (accepted, install.md), whitespace variants (mitigated, M1-16), tool descriptions changed by an upstream release (open, mcp-protocol-engineer, M2 re-pin with row 16), no secret scanner in CI (open, release-engineer with test-engineer), an upstream opening Fathomgate''s own process on Windows (N5, open, mcp-protocol-engineer). The leading-dash row was already routed (M1-14). OWASP mapping and SECURITY.md summary updated. security-reviewer to review. Round 2 (security review of PR #194): the Windows process row names write and inject rights, the M2 redaction and M4 audit keys, likely full access (not measured), 