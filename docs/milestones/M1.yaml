    notes: 'The pipeline stages behind the proxy seam, tier 1 only, no transport. Evaluate stays pure; the gate takes counters as input. Deny text exactly as ADR 0026; no argument value or upstream text in it. Reserved rule id default:bad_arguments. Fail-closed rows for hold and for the dry_run, diff and timed_rollback obligations. Also fix the internal/inventory package doc, which says the upstream INVENTORY_READ provider is M1 (PRD R14 says M2). Docs in the same PR: policy-schema section 5 (reserved id), ARCHITECTURE.md components table (internal/gate). From the reviews of PR #154 and #152: normalise must reject a target that is not a hostname or IP literal (@, whitespace, control characters, : outside IPv6) with default:bad_arguments, and match inventory names on the exact string the upstream receives (no trimming). Gate tests must carry the PR #152 injection inputs and the attacker-host names (core-x.attacker.example etc.) from arguments to decision (see M1-33). From the security review of PR #158: the normaliser denies with default:bad_arguments any call to a tool that declares target, targets or group params, is not INVENTORY_READ or LOCAL_ADMIN, and arrives with zero targets (eos-mcp daily_brief with no hostnames runs on the upstream''s whole fleet while fathomgate counts 0, bypassing max_devices and the unknown-target default). Amends profile-schema §2; short ADR if the architect judges it a policy-semantics change. An @tag must never be expanded from fathomgate''s own inventory for an upstream that expands it itself. M1-35, M1-36 and M1-37 must land before eos-mcp is marked validated. Merged in PR #162 2026-09-25 (internal/gate, internal/gate/seam) after security, Go and design reviews and two fix rounds.'
