    matrix: [3, 4, 6]
    notes: 'From the security reviews of PR #154 and #152. A *.test.yaml case takes its class as given, so rows 3 and 4 are proved only at the policy level and the PR #152 injection inputs cannot be expressed. Short ADR (test-file schema is a spec interface): optional profile, arguments and inventory fields on a case; when present the case runs the same internal/gate path the proxy uses (normalise, classify, resolve, Evaluate). Then add cases for the PR #152 injection inputs, the attacker-host names from PR #154, and rows 3, 4 and 6 through each validated server profile. Ties M1 exit criterion 2 (policy test suite green) to real commands. 2026-09-25 (docs/adr-policy-test-gate-path, policy-engineer): ADR 0035 drafted, status proposed, awaiting the maintainer; no code until it is accepted. A case with request.arguments or arguments_json (instead of class) runs gate.Decide; profiles are the embedded set or policy test --profiles (the serve loader), a file-level inventory (path or inline) is read as serve --inventory reads it; new expect fields class, class_source, targets, unknown_target, parse_error, unnamed_args, malformed_args, forwarded, tool_error; the 45 class-given cases are unchanged; policy eval --profile moves onto the same gate path; the runner moves to a new internal/policytest (internal/gate imports internal/policy). Nine open questions with recommendations. ADR 0035 accepted by the maintainer 2026-09-25 with all nine recommendations; implementation next. 2026-09-25 (feat/policy-test-gate-path, policy-engineer, PR #197, stacked on #191): ADR 0035 implemented. internal/policytest (format and runner, moved from internal/policy; TestRepoExamplePolicies moved) runs class-given cases through Evaluate and gate cases (request.arguments or arguments_json, annotations, session) through internal/gate Explain, with the embedded profiles or policy test --profiles and a file-level inventory (path with configfile checks, or inline); new expect fields class, class_source, targets, unknown_target, parse_error, unnamed_args, malformed_args, forwarded, tool_error; load errors as ADR 0035. internal/configset shares the profile-set and inventory loading with serve and inventory lint/resolve. policy eval --profile decides through gate.Explain, --arguments-json, --class/--target usage errors. New policies/examples/*.gate.test.yaml: 112 gate cases (75/22/15) for rows 3, 4 and 6 at tier 1, the PR #152 injection inputs and the PR #154 names under active patterns; the 45 class-given cases unchanged. Deviation for review: internal/gate exports Explain (ADR 0035 notes after acceptance). Found: inventory-schema section 3 says version: 1 is required but the decoder refuses a version key (for network-safety-engineer). Handoff to security-reviewer. 2026-09-25 (fix/policytest-review, policy-engineer, PR #199): PR #197 merged before its security review finished; the review approved (no critical, high or medium). Follow-up PR addresses L1 to L4, N1 to N4 and the Go notes: internal/termsafe (one quoting helper; fail and failTo escape C0 except LF and tab, DEL, C1 and bidi; paths quoted at the source; configfile no longer repeats the raw path); test files capped at 16 MiB, anchors and aliases refused, case names at most 256 bytes; unquoted values in arguments must reach the gate as written; absent record fields fail their assertion; policy eval reads --profile and --inventory through configset; configset tests; evalGate takes a struct; eval labels aligned; bad-target gate cases assert targets and tool_error, and a show run | append case is new (113 gate cases). The maintainer accepted the gate.Explain export 2026-09-25 with guard tests TestGateSurface (internal/proxy) and TestExplainMatchesDecide and FuzzExplainMatchesDecide (internal/gate), recorded in ADR 0035. Stays in review until the follow-up merges; handoff to security-reviewer. 2026-09-25 (PR #199, round 2): re-review approved (no critical, high or medium). R1: termsafe.Text escapes LF and tab too; configfile''s icacls fix travels as configfile.Hint and printError prints it after the escaped message (fail, failTo, serve, inventory lint); invalid hostname patterns and profile server keys and tool names are quoted at the source; TestNoForgedLines. R2: inventory-permissions sentence in README and CLAUDE.md. R3: a number passes unquoted only if its JSON is its text; look-alike strings say quote it. TestGateSurface walks subdirectories and refuses Explain-containing identifiers and MethodByName. Threat rows mitigated. Stays in review until PR #199 merges. ADR 0035 merged in PR #191; code in PR #197; security follow-up in PR #199, all 2026-09-25. Explain export accepted by the maintainer with guard tests.'
  - id: M1-34
    title: Decide whether a hostname pattern alone may make a target known (inventory ADR)
    package: internal/inventory
    owner: network-safety-engineer
    reviewers: [security-reviewer, policy-engineer]
    state: merged
    adr: "0031"
    matrix: [6]
    spec: docs/specs/inventory-schema.md
    notes: 'From the security review of PR #154 (H1, H2). internal/inventory/patterns.go Resolve returns known:true on any match, so a pattern switches off the unknown-target default for every string it matches (reads reach attacker-chosen hosts through free-form-host upstreams; tags from a pattern could unlock writes). inventory-schema originally intended that a tags-only pattern never makes a target known. ADR options: a pattern never makes a target known on its own (it only adds attributes to a listed device); or it may, but pattern-derived tags can never satisfy device_tags for WRITE_CONFIG, EXEC_ARBITRARY or LAB_LIFECYCLE (carry Target.Status pattern into policy.Target). The shipped example has no active patterns meanwhile. Threat-model row: Pattern-resolved target (reads and writes). ADR 0031 drafted in PR #157; accepted by the maintainer 2026-09-25 with all recommendations: a pattern never makes a target known on its own; a pattern-given role or tags count for write rules on a device listed elsewhere; upstream-listed devices decided in the M2 upstream-provider ADR; warning at load, error in inventory lint for a pattern matching no listed device; no aliases field yet. Code change is a follow-up task. ADR 0031 accepted and merged in PR #157 2026-09-25. Remaining: the code change (a pattern never makes a target known on its own; merge attributes across providers per inventory-schema section 2; warning at load, error in inventory lint). 2026-09-25 (feat/inventory-patterns-enrich, network-safety-engineer): ADR 0031 implemented. inventory.Chain is now {Authorities []Resolver, Enrichers []Enricher}; Patterns is an Enricher (Attributes, no Resolve), so a name no authority lists is unknown whatever it matches; the inventory-schema section 2 merge (record wins, first pattern fills empty role/site, tags union) and per-field provenance (Target.Source, Sources, Stale; refused in a file) are implemented; internal/gate drops its status: pattern check; policy eval applies the exact-name rule; new fathomgate inventory lint (fails on a pattern matching no listed device) and inventory resolve (per-field source). All ten ADR 0031 tests, incl. FuzzPatternsNeverResolveUnlisted. Threat-model row Pattern-resolved target mitigated. Security review requested. PR #184. Round 1 (approve, four lows L1-L4, nits N1-N3) addressed: later authorities fill empty fields only and add no tags, a record for another name is ignored; inventory.Known is the one exact-name rule; lint warns per pattern effect and fails on names the gate refuses; lint and resolve read via configfile; policy eval refuses bad --target names; resolve quotes non-ASCII; status: pattern refused. Round 2: Unix-safe lint test; later authorities run after the patterns and fill only site and status (never role or tags, R2-L1). Merged in PR #184 2026-09-25.'
  - id: M1-35
    title: Refuse tool arguments the profile does not name (eos-mcp config_path) (ADR)
    package: internal/classify
    owner: policy-engineer
    reviewers: [security-reviewer, go-reviewer]
    state: merged
    matrix: [4]
    notes: 'From the security review of PR #158 (critical once enforced). Every eos-mcp tool takes config_path: an agent-chosen file the upstream parses with configparser, quoting malformed lines in the error (one-line files such as /proc/<ppid>/environ leak fathomgate''s whole environment, FATHOMGATE_LISTEN_TOKEN and every --upstream-env-pass value) and using it to replace the credentials for that call. Reproduced: get_version and get_router_list with config_path are allowed under read-only. ADR (profile schema): options are a per-tool forbidden_params list, or a closed list where any argument the profile does not name is denied with default:bad_arguments (also covers parameters an upstream adds in a later version); deny, never strip. Interim: operators put a deny rule for eos-mcp first or sandbox it (documented in the profile header). Blocks eos-mcp validation in M1-28. Maintainer decided 2026-09-25: a closed list - any argument the profile does not name is denied with default:bad_arguments, never stripped. ADR written as accepted in the implementing PR. Merged in PR #161 2026-09-25 (ADR 0033 closed argument list; JSON-string arguments malformed; junos Jinja2 tool EXEC_ARBITRARY).'
  - id: M1-36
    title: Config lines that leave the configure session make a write EXEC_ARBITRARY
    package: internal/classify
    owner: policy-engineer
    reviewers: [security-reviewer, go-reviewer]
    state: merged
    matrix: [4]
    spec: docs/specs/classification.md
    notes: 'From the security review of PR #158. eos-mcp push_config sends each config_lines element in the same eAPI call as configure session <name>; ["end", "reload now"] or ["end", "configure", "hostname x"] runs outside the session before any abort, turning WRITE_CONFIG into EXEC_ARBITRARY or a write with no commit timer. Reproduced under lab-open: push_config config_lines=end allowed by lab-writes-free. Check every config_params element: any control or non-ASCII byte, or a first word in a mode-exit or exec list (end, exit, configure/conf, reload, bash, copy, write/wr, delete, run, do, enable, clear, rollback, ...), makes the call EXEC_ARBITRARY. Classification spec update, no ADR. Tier 2 test on cEOS proves or disproves the escape. M3 note: a dry_run driver must never use the upstream''s push_config dry_run=True (it sends the payload before approval), and show session-config diffs hides anything after end. 2026-09-25 (feat/classify-config-escape): internal/classify/config.go checks every line of every config_params element of a tool not already EXEC_ARBITRARY; control or non-ASCII byte, a line not starting with a letter, digit or ! (leading-symbol), or a first word abbreviating the CLI union escape list (escape-word) makes it EXEC_ARBITRARY, class_source reclassify. junos load_and_commit_config: set format (default) is an allow-list of set statements (set-verb), text and xml are data (bytes only). classification.md section 11, threat-model row, security_test.go and gate TestConfigSessionEscape. Tier 2 on cEOS still to prove the device behaviour (M1-28). PR #170 security review round 1 (request changes, 3 high, 2 medium, 2 low) addressed: ; fails (separator, NX-OS), alias and cli, scheduled execution now EXEC_ARBITRARY (event, event-handler, schedule, scheduler, kron, daemon, command; Junos event-options, scripts, extensions, execute-commands in every format, exec-config), more EOS exec verbs, Junos top/up only bare, xml <! (dtd), 1024-byte line and 64 KiB payload caps, no-exec reason reworded in the three example policies. Open: EOS push_config top-level allow-list (the denylist cannot be complete); cEOS tier 2 adds clock set and watch. Round 2 re-review (request changes, small) addressed: login autocommand in any word position (exec-config), ; checked before comment lines, Junos words trimmed of punctuation, one-letter Junos words recorded as an accepted cost; Junos text abbreviations pending tier 2 on vMX or cRPD (M1-28). Merged in PR #170 2026-09-25 after three security rounds and Go approval: config payload lines checked (escape words, separators, scheduled execution, autocommand, Junos set verbs). Open: an EOS allow-list of top-level config words (long-term fix); cEOS and vMX tier 2 checks listed in M1-28.'
  - id: M1-37
    title: Make an unset unknown_target deny every class (ADR)
    package: internal/policy
    owner: policy-engineer
