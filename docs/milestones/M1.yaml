    state: merged
    matrix: [6]
    notes: 'From the security reviews of PR #154, #158 and ADR 0031 (PR #157) question 4. A policy that leaves defaults.unknown_target unset still lets reads reach unknown hosts; for upstreams that send the fleet''s credentials to any host the agent names (eos-mcp: TLS verification off, TLS 1.0; netdev-ssh-mcp free-form host), reads are as dangerous as writes. ADR: the unset default denies every class (recommended), or a profile flag forces deny for that server. Awaiting the maintainer''s decision with ADR 0031. Maintainer decided 2026-09-25: an unset unknown_target denies every class (per-server flag rejected). ADR written as accepted in the implementing PR. Merged in PR #160 2026-09-25 (ADR 0032).'
  - id: M1-38
    title: Issue hygiene - GitHub issues follow the board automatically
    package: tools/status
    owner: release-engineer
    reviewers: [security-reviewer, docs-writer]
    state: merged
    matrix: []
    notes: 'The maintainer found 32 open issues, 16 of them stale (work merged or moved); the orchestrator closed them by hand 2026-09-25. tools/status/issues.py (stdlib and PyYAML, GitHub through `gh api`) reads every docs/milestones/*.yaml; for each task, the issues whose title starts with the task id get exactly one state:<state> label (the effective state STATUS.md shows), one milestone:<Mn> and one agent:<owner> label (a human owner''s issue keeps its agent labels), and are closed with a one-line comment naming the PR from the notes when the task is merged or validated (completed) or dropped (not planned). Missing labels that .github/labels.yml defines are created. It reports, and never changes: open issues for task ids on no board, active tasks with no issue, closed issues of active tasks (not reopened), tasks with more than one issue, task-id issues opened by someone not an owner, member or collaborator (never touched), and open issues with no activity in 30 days. Dry run by default; --apply changes; idempotent. .github/workflows/issue-hygiene.yaml runs --apply on a push to main that touches docs/milestones/**, weekly and by hand, on a hosted runner with permissions {} at the top and issues: write only on the job, never on pull_request; the drift report goes to the job summary. /status runs the dry run. Tests: tests/unit/test_status_issues.py with GitHub faked. Opened as PR #175. Security review of PR #175 (approve with conditions) addressed: --max-close N (default 5; more closures sets labels only, lists them and exits 3; workflow_dispatch input max_close), push runs pass --since <before> so only tasks whose state changed in the push close; exit 2 before any change on a label .github/labels.yml does not define or a task id on two boards; setup-uv pinned to uv 0.12.17 and PyYAML from tools/status/requirements.txt with --require-hashes; titles lose Unicode Cc, Cf, Zl and Zp and sit in code spans in the summary; CONTRIBUTOR is an outsider in the tests; the title convention is documented; the report and summary are written in a finally block so a partial run reports how far it got; threat-model boundary CI <-> GitHub Issues and its row added. Merged in PR #175 2026-09-25.'
  - id: M1-39
    title: Bring the worst cases at the 64 KiB argument cap under the 5 ms budget (per-call caps, one Decide)
    package: internal/gate
