rding; main with #168 and #170 merged in. Round 3 2026-09-25 (security and Go approve round 2): Windows refusals name every writer and print a working icacls fix, directory advice in messages and install.md, ADR 0011 amendment, error-quoting note in profile-schema 8.3, POSIX ACL test, threat-model residuals. PR #171 merged 2026-09-25 before round 3 was pushed; round 3 is a follow-up PR.'
