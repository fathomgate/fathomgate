    state: merged
    matrix: []
    notes: 'Found at kickoff. tools/status/render.py HANDOFF_RE takes the task id as the last hyphen-free part of the file name, so 2026-09-26-mcp-protocol-engineer-to-go-reviewer-M1-06.md renders with the receiver go-reviewer-M1 and the task 06. The /milestone procedure prescribes ids like M1-03. Fix the pattern (task id matches M<n>-<nn> or T<n>.<n>), add cases to tests/unit/test_status_render.py, and say it in docs/handoffs/README.md. Until it merges, name handoff files with the task id written M1.06; the note body uses M1-06. Do this first: every other M1 task ends with a handoff. 2026-09-25 (fix/status-hyphen-ids): render.py tries HANDOFF_HYPHEN_RE first (task id M<n>-<n> or T<n>-<n> ending the name, optional -round<n> suffix), then the old dot-form pattern; every existing note parses exactly as before and render.py --check is unchanged. Cases in tests/unit/test_status_render.py, including one that compares every note on disk with the old pattern. docs/handoffs/README.md names the hyphen form. PR #190. Go review approved; fixes: the on-disk test asserts every hyphen-form name is dated 2026-09-25 or later, latest_handoffs orders by (date, name without -round<n>, round) so round2 follows its base note and round10 follows round2, owner and reviewers match the review that ran. Follow-up (not in this PR): render.py --check should warn on a .md name in docs/handoffs/ that neither pattern reads. Merged in PR #190 2026-09-25.'
  - id: M1-32
    title: Refuse a hybrid upstream at startup, and refuse server-initiated input from an upstream connected via server/discover
    package: internal/proxy
    owner: mcp-protocol-engineer
    reviewers: [security-reviewer, go-reviewer]
    state: merged
    blocked_by: [M1-06]
    adr: "0008"
    matrix: [2]
    notes: 'From the security review of PR #151 (M1-06). (1) If initialize is answered with a later version than requested (the hybrid: go-sdk then attaches 2026 _meta self-description while a session exists), close the session, kill the upstream and exit with an error naming both versions and ADR 0008; no flag. Record the requested version in the handshake middleware. Real servers are unaffected: go-sdk servers cap initialize answers at 2025-11-25, TS and Python SDKs echo the requested version. The M1-06 hybrid tests flip to expect refusal. Factual amendment row on ADR 0008 and profile-schema 8.4 (orchestrator judged no new ADR: no CLI or export change). (2) F1: go-sdk accepts elicitation/create from an upstream in either era; refuse it (sampling is already refused) from an upstream fathomgate connected via server/discover, with a refusal naming the reason, per ADR 0008. Close the two threat-model rows M1-06 opens. PR #181 2026-09-25: the handshake middleware reads the requested version and returns a hybridError for a later answer (no initialised notification, session closed, attempt cancelled so the process tree is killed at once; never retried); upstreamElicitation refuses elicitation/create when upstream.handshake is unset (connected via server/discover), before any other check, with or without a policy. M1-06 hybrid tests flipped; TestDiscoveredUpstreamElicitationRefused new. ADR 0008 amendment row, profile-schema 8.2/8.3/8.4, both threat-model rows Mitigated. Conformance green, baselines unchanged. In security review. Merged in PR #181 2026-09-25.'
