  - id: M1-32
    title: Refuse a hybrid upstream at startup, and refuse server-initiated input from an upstream connected via server/discover
    package: internal/proxy
    owner: mcp-protocol-engineer
    reviewers: [security-reviewer, go-reviewer]
    state: open
    blocked_by: [M1-06]
    adr: "0008"
    matrix: [2]
    notes: 'From the security review of PR #151 (M1-06). (1) If initialize is answered with a later version than requested (the hybrid: go-sdk then attaches 2026 _meta self-description while a session exists), close the session, kill the upstream and exit with an error naming both versions and ADR 0008; no flag. Record the requested version in the handshake middleware. Real servers are unaffected: go-sdk servers cap initialize answers at 2025-11-25, TS and Python SDKs echo the requested version. The M1-06 hybrid tests flip to expect refusal. Factual amendment row on ADR 0008 and profile-schema 8.4 (orchestrator judged no new ADR: no CLI or export change). (2) F1: go-sdk accepts elicitation/create from an upstream in either era; refuse it (sampling is already refused) from an upstream fathomgate connected via server/discover, with a refusal naming the reason, per ADR 0008. Close the two threat-model rows M1-06 opens.'
  - id: M1-33
    title: Policy test cases that carry a profile, arguments and an inventory and run the gate path (ADR)
    package: internal/policy
    owner: policy-engineer
    reviewers: [security-reviewer, go-reviewer]
    state: open
    blocked_by: [M1-18]
    matrix: [3, 4, 6]
    notes: 'From the security reviews of PR #154 and #152. A *.test.yaml case takes its class as given, so rows 3 and 4 are proved only at the policy level and the PR #152 injection inputs cannot be expressed. Short ADR (test-file schema is a spec interface): optional profile, arguments and inventory fields on a case; when present the case runs the same internal/gate path the proxy uses (normalise, classify, resolve, Evaluate). Then add cases for the PR #152 injection inputs, the attacker-host names from PR #154, and rows 3, 4 and 6 through each validated server profile. Ties M1 exit criterion 2 (policy test suite green) to real commands.'
  - id: M1-34
    title: Decide whether a hostname pattern alone may make a target known (inventory ADR)
    package: internal/inventory
    owner: network-safety-engineer
    reviewers: [security-reviewer, policy-engineer]
    state: open
    matrix: [6]
    notes: 'From the security review of PR #154 (H1, H2). internal/inventory/patterns.go Resolve returns known:true on any match, so a pattern switches off the unknown-target default for every string it matches (reads reach attacker-chosen hosts through free-form-host upstreams; tags from a pattern could unlock writes). inventory-schema originally intended that a tags-only pattern never makes a target known. ADR options: a pattern never makes a target known on its own (it only adds attributes to a listed device); or it may, but pattern-derived tags can never satisfy device_tags for WRITE_CONFIG, EXEC_ARBITRARY or LAB_LIFECYCLE (carry Target.Status pattern into policy.Target). The shipped example has no active patterns meanwhile. Threat-model row: Pattern-resolved target (reads and writes). ADR 0031 drafted in PR #157; accepted by the maintainer 2026-09-25 with all recommendations: a pattern never makes a target known on its own; a pattern-given role or tags count for write rules on a device listed elsewhere; upstream-listed devices decided in the M2 upstream-provider ADR; warning at load, error in inventory lint for a pattern matching no listed device; no aliases field yet. Code change is a follow-up task. ADR 0031 accepted and merged in PR #157 2026-09-25. Remaining: the code change (a pattern never makes a target known on its own; merge attributes across providers per inventory-schema section 2; warning at load, error in inventory lint). Until then the gate treats a pattern-only match as unknown and patterns do not enrich listed devices.'
  - id: M1-35
    title: Refuse tool arguments the profile does not name (eos-mcp config_path) (ADR)
    package: internal/classify
    owner: policy-engineer
    reviewers: [security-reviewer, go-reviewer]
    state: merged
    matrix: [4]
    notes: 'From the security review of PR #158 (critical once enforced). Every eos-mcp tool takes config_path: an agent-chosen file the upstream parses with configparser, quoting malformed lines in the error (one-line files such as /proc/<ppid>/environ leak fathomgate''s whole environment, FATHOMGATE_LISTEN_TOKEN and every --upstream-env-pass value) and using it to replace the credentials for that call. Reproduced: get_version and get_router_list with config_path are allowed under read-only. ADR (profile schema): options are a per-tool forbidden_params list, or a closed list where any argument the profile does not name is denied with default:bad_arguments (also covers parameters an upstream adds in a later version); deny, never strip. Interim: operators put a deny rule for eos-mcp first or sandbox it (documented in the profile header). Blocks eos-mcp validation in M1-28. Maintainer decided 2026-09-25: a closed list - any argument the profile does not name is denied with default:bad_arguments, never stripped. ADR written as accepted in the implementing PR. Merged in PR #161 2026-09-25 (ADR 0033 closed argument list; JSON-string arguments malformed; junos Jinja2 tool EXEC_ARBITRARY).'
  - id: M1-36
    title: Config lines that leave the configure session make a write EXEC_ARBITRARY
    package: internal/classify
    owner: policy-engineer
    reviewers: [security-reviewer, go-reviewer]
    state: merged
    matrix: [4]
    spec: docs/specs/classification.md
    notes: 'From the security review of PR #158. eos-mcp push_config sends each config_lines element in the same eAPI call as configure session <name>; ["end", "reload now"] or ["end", "configure", "hostname x"] runs outside the session before any abort, turning WRITE_CONFIG into EXEC_ARBITRARY or a write with no commit timer. Reproduced under lab-open: push_config config_lines=end allowed by lab-writes-free. Check every config_params element: any control or non-ASCII byte, or a first word in a mode-exit or exec list (end, exit, configure/conf, reload, bash, copy, write/wr, delete, run, do, enable, clear, rollback, ...), makes the call EXEC_ARBITRARY. Classification spec update, no ADR. Tier 2 test on cEOS proves or disproves the escape. M3 note: a dry_run driver must never use the upstream''s push_config dry_run=True (it sends the payload before approval), and show session-config diffs hides anything after end. 2026-09-25 (feat/classify-config-escape): internal/classify/config.go checks every line of every config_params element of a tool not already EXEC_ARBITRARY; control or non-ASCII byte, a line not starting with a letter, digit or ! (leading-symbol), or a first word abbreviating the CLI union escape list (escape-word) makes it EXEC_ARBITRARY, class_source reclassify. junos load_and_commit_config: set format (default) is an allow-list of set statements (set-verb), text and xml are data (bytes only). classification.md section 11, threat-model row, security_test.go and gate TestConfigSessionEscape. Tier 2 on cEOS still to prove the device behaviour (M1-28). PR #170 security review round 1 (request changes, 3 high, 2 medium, 2 low) addressed: ; fails (separator, NX-OS), alias and cli, scheduled execution now EXEC_ARBITRARY (event, event-handler, schedule, scheduler, kron, daemon, command; Junos event-options, scripts, extensions, execute-commands in every format, exec-config), more EOS exec verbs, Junos top/up only bare, xml <! (dtd), 1024-byte line and 64 KiB payload caps, no-exec reason reworded in the three example policies. Open: EOS push_config top-level allow-list (the denylist cannot be complete); cEOS tier 2 adds clock set and watch. Round 2 re-review (request changes, small) addressed: login autocommand in any word position (exec-config), ; checked before comment lines, Junos words trimmed of punctuation, one-letter Junos words recorded as an accepted cost; Junos text abbreviations pending tier 2 on vMX or cRPD (M1-28). Merged in PR #170 2026-09-25 after three security rounds and Go approval: config payload lines checked (escape words, separators, scheduled execution, autocommand, Junos set verbs). Open: an EOS allow-list of top-level config words (long-term fix); cEOS and vMX tier 2 checks listed in M1-28.'
  - id: M1-37
    title: Make an unset unknown_target deny every class (ADR)
    package: internal/policy
    owner: policy-engineer
    reviewers: [security-reviewer, go-reviewer]
    state: merged
    matrix: [6]
    notes: 'From the security reviews of PR #154, #158 and ADR 0031 (PR #157) question 4. A policy that leaves defaults.unknown_target unset still lets reads reach unknown hosts; for upstreams that send the fleet''s credentials to any host the agent names (eos-mcp: TLS verification off, TLS 1.0; netdev-ssh-mcp free-form host), reads are as dangerous as writes. ADR: the unset default denies every class (recommended), or a profile flag forces deny for that server. Awaiting the maintainer''s decision with ADR 0031. Maintainer decided 2026-09-25: an unset unknown_target denies every class (per-server flag rejected). ADR written as accepted in the implementing PR. Merged in PR #160 2026-09-25 (ADR 0032).'
  - id: M1-38
    title: Issue hygiene - GitHub issues follow the board automatically
    package: tools/status
    owner: release-engineer
    reviewers: [security-reviewer, docs-writer]
    state: in review
    matrix: []
    notes: 'The maintainer found 32 open issues, 16 of them stale (work merged or moved); the orchestrator closed them by hand 2026-09-25. tools/status/issues.py (stdlib and PyYAML, GitHub through `gh api`) reads every docs/milestones/*.yaml; for each task, the issues whose title starts with the task id get exactly one state:<state> label (the effective state STATUS.md shows), one milestone:<Mn> and one agent:<owner> label (a human owner''s issue keeps its agent labels), and are closed with a one-line comment naming the PR from the notes when the task is merged or validated (completed) or dropped (not planned). Missing labels that .github/labels.yml defines are created. It reports, and never changes: open issues for task ids on no board, active tasks with no issue, closed issues of active tasks (not reopened), tasks with more than one issue, task-id issues opened by someone not an owner, member or collaborator (never touched), and open issues with no activity in 30 days. Dry run by default; --apply changes; idempotent. .github/workflows/issue-hygiene.yaml runs --apply on a push to main that touches docs/milestones/**, weekly and by hand, on a hosted runner with permissions {} at the top and issues: write only on the job, never on pull_request; the drift report goes to the job summary. /status runs the dry run. Tests: tests/unit/test_status_issues.py with GitHub faked. Opened as PR #175. Security review of PR #175 (approve with conditions) addressed: --max-close N (default 5; more closures sets labels only, lists them and exits 3; workflow_dispatch input max_close), push runs pass --since <before> so only tasks whose state changed in the push close; exit 2 before any change on a label .github/labels.yml does not define or a task id on two boards; setup-uv pinned to uv 0.12.17 and PyYAML from tools/status/requirements.txt with --require-hashes; titles lose Unicode Cc, Cf, Zl and Zp and sit in code spans in the summary; CONTRIBUTOR is an outsider in the tests; the title convention is documented; the report and summary are written in a finally block so a partial run reports how far it got; threat-model boundary CI <-> GitHub Issues and its row added.'
