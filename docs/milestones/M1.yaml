    notes: 'From the M1-23 findings (PR #183, gatetest.KnownOverBudget). Per-call caps in internal/gate, before classification: at most 64 commands (command_params strings, arrays flattened) and at most 256 target names and group selectors (target, targets and group params, comma parts, repeats counted); over either is default:bad_arguments with fixed text naming the cap, parse_error too_many_commands or too_many_targets (profile-schema 2.4, policy-schema 4 step 1). The blocklist and shell-metacharacter regexps in classify run as a word-set lookup and a byte loop, checked against the old expressions by fuzz tests (classification.md 5.3, 5.4; 1 KiB command 61 us to 5.5 us). The proxy runs Decide once: seam.CallInfo.Counted lets the gate take already-touched targets off devices_touched under the key''s lock (ADR 0026 note). KnownOverBudget is empty. PR #185 2026-09-25, stacked on PR #183 (retarget to main when it merges): worst-case p50 about 1 ms or less in Decide and in the proxy stage (was 5.5 to 18 ms on Windows); p99 at GOMAXPROCS 16 on Windows is still set by collector stalls, 1.2 to 2.1 ms at GOMAXPROCS 4. Handoff to security-reviewer. ADR 0026 M1-39 note accepted by the maintainer 2026-09-25; security and Go reviews approved, round 2 done. Merged in PR #185 2026-09-25.'
  - id: M1-40
    title: Deflake the loopback bind tests (other family taken, release after refusal)
    package: cmd/fathomgate
    owner: mcp-protocol-engineer
    reviewers: [go-reviewer, test-engineer]
    state: merged
    matrix: []
    notes: 'TestBindLoopbackRefusesTakenOtherFamily (macOS, main run 36188372158 and PR #181 run 36191386947) and TestServeListenOtherFamilyTaken (Linux, run 36187830265) failed at random with address already in use. Root cause in the tests, not the product: a squatter takes one family on an OS-chosen port, which is free for that family only; another socket (a parallel test in the binary, another package''s test binary, any program) may already hold the other family''s address on it, or take it the moment bindLoopback releases it. macOS, and Windows, hand out ephemeral ports in sequence, so the port just picked for [::1] is often the next picked for 127.0.0.1 (in the macOS run the thief was a sibling bind of 127.0.0.1:0). bindLoopback closes every socket it bound on each refusal path. Fix: the tests try a new squatter port (up to 50) when the first bind finds the address taken, and prove the release by asking the sockets bindLoopback bound (a recording listenFunc and holdFunc: each listener''s descriptor is closed, each hold closed once without error) instead of binding the address again, which cannot tell a leak from another test''s socket. Same change to the Windows analogues (RefusesHeldWildcardWindows, ServeListenWildcardHeldWindows, the wildcard release in ExclusiveWindows). Mutation-checked: dropping first.Close, the hold close or the loopback closes before a hold refusal fails the tests. PR #186. Go review round 1 (one blocker) addressed: new TestHeldSocketsCloseReleasesWindows re-binds both loopbacks and every wildcard kind after the close, retrying on a fresh port (a leak fails every attempt; the reviewer''s heldSockets.Close mutation now fails it); checkReleased on every return path; retries only on address in use (addrTaken per OS), any other first-bind error fails at once. Merged in PR #186 2026-09-25 after a Go review round 2 (OS-level wildcard release proof, TestHeldSocketsCloseReleasesWindows). Two nits moved to M1-41.'
  - id: M1-41
    title: Retry the serve listener tests only on address in use (typed error from run)
    package: cmd/fathomgate
    owner: mcp-protocol-engineer
    reviewers: [go-reviewer]
    state: merged
    matrix: []
    notes: 'From the Go re-review of PR #186 (nits, not blocking). serveListenOtherFamilyTaken (listen_bind_test.go) and serveListenWildcardHeld (listen_windows_test.go) retry on any first-bind failure matched by stderr text, not only on address in use, because run() exposes no typed error; a real failure still fails after 50 attempts with every attempt logged. Have run() (or a test seam) return the bind error so the tests can use addrTaken. Also: the deferred rec.checkReleased(t) runs after a t.Fatalf in the same attempt and may add extra still-bound lines after a failure; consider skipping it when t.Failed(). 2026-09-25 (test/serve-listen-typed-retry): serveContext binds through a binder{listen, hold} (listenTCP and holdWildcards, as before) and serveBinding takes it as a test seam; no CLI or text change. PR #192. Both serve tests pass a bindRecorder, retry only when a recorded bind error is addrTaken, fail on any other, and check release. Deferred release checks use checkReleasedOnReturn (skipped when t.Failed()). Mutation: serve binding with listenTCP instead of the seam fails both tests. Conformance run by hand, all legs and era pairs green. Go review approved; fixes: binder godoc (both fields required, nil hold holds nothing), checkReleasedOnReturn doc, locked recordedHolds() in the two new holds assertions. Merged in PR #192 2026-09-25.'
  - id: M1-42
    title: Secret scanner (gitleaks) in CI for the repository and fixtures
    package: .github/workflows
    owner: release-engineer
    reviewers: [security-reviewer, test-engineer]
    state: merged
    matrix: []
    notes: 'Maintainer decision 2026-09-25 (repository public since 2026-09-24); threat-model row "Secret scanner not in CI" (PR #194, security review of PR #108). CI job gitleaks on ubuntu-latest, read-only token, every pull request (base..head commits) and every push to main and weekly (full history), fetch-depth 0. gitleaks 8.30.1 is the upstream release binary fetched by make secrets-scan and checked against the sha256 pinned in the Makefile (the release checksums file, cross-checked with GitHub asset digests); no third-party action (gitleaks-action needs a licence key for organisation repositories). .gitleaks.toml: built-in rules plus five network-config rules scoped to tests/fixtures/ (the built-in rules do not see device secrets); one allow-list bound to those rules (targetRules), condition AND, named fixture files plus a secret that starts with FAKE after an optional vendor marker. A global allow-list with paths would make gitleaks dir skip the whole file (8.30.1 shouldSkipPath). .gitleaksignore: four fingerprints with reasons. Negative control make secrets-control (tools/secrets/control.sh) runs first, git and dir mode; mutation-checked (global allow-list, FAKE anywhere, rule dropped all fail). Full-history scan over every branch before the PR: no real secret; three built-in-rule false positives and the IOS-XE fixture value 0822455D0A16FAKE7 (renamed FAKE0822455D0A16). No ADR: CI tooling, no go.mod change (golangci-lint and actionlint precedent); noted in the PR. Opened as PR #198 2026-09-25. Handoff to security-reviewer, with the threat-model row wording (PR #194 not yet merged). Security review of PR #198 (changes requested, nothing critical or high) addressed in round 2: tools/secrets/scan.py drives gitleaks with --diff-merges=first-parent (remerge and combined diffs do not parse in 8.30.1), drops a merge finding only when the line is already in another parent, checks both range ends (cat-file, merge-base) and fails on 0 commits scanned; --ignore-gitleaks-allow; a second PR scan with the base branch''s .gitleaks.toml and .gitleaksignore; TestFixtureCorpus requires every listed secret to be FAKE-prefixed and every redacted value to be listed (the first line; gitleaks rules are the second, $4$/$14$, type 3 and the ; gap fixed); .gitleaksignore format check; the cached archive re-hashed before each use; CLAUDE.md records that CI-only tools need no ADR (maintainer 2026-09-25). Round 2 section in the handoff note. Round 3 (re-review, one medium): a merge finding is dropped only when its whole StartLine..EndLine block is in another parent (a new PEM key in a merge is found; control case with random key bodies); TestFixtureCorpus messages never print values; TestTranscriptSecretsAreFake covers the device transcripts; the ignore-file check is CRLF-safe. Round 3 section in the handoff note. Merged in PR #198 2026-09-25 after three security rounds. Maintainer enabled GitHub secret scanning and push protection 2026-09-25. Open for the maintainer: add `gitleaks` to the main ruleset required checks; non-provider patterns off.'
  - id: M1-43
