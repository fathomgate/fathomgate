    reviewers: [security-reviewer, go-reviewer]
    state: merged
    adr: "0011"
    matrix: []
    notes: 'From the T0.7 security review. On Windows, SaveKey 0600 is ignored and the key inherits its folder ACL, so a local non-admin user can read audit.key and re-sign checkpoints over a rewritten log. os.WriteFile also keeps the mode of an existing file on Unix. Needs golang.org/x/sys/windows (ADR 0011). Branch fix/audit-key-perms on land/m0-stack, not pushed. SaveKey and new logs: exclusive create; Unix O_EXCL + Chmod 0600; Windows CreateFile(CREATE_NEW) with O:<user>D:P(A;;FA;;;<user>)(A;;FA;;;SY). No --force added (CLI surface). x/sys v0.41.0 -> v0.47.0 (GO-2026-5024), now direct. Windows DACL tests read the ACL back from a ProgramData-like folder. Review round 1 (security-reviewer REQUEST CHANGES, 2026-09-23) addressed: existing logs are opened once without following links (O_NOFOLLOW / FILE_FLAG_OPEN_REPARSE_POINT), refused unless a regular single-link file owned by the current user, verified through the held handle, and only then reset to owner-only; partial files deleted through the handle; keygen refuses an existing .pub and writes it first (WriteKeyPair). Review round 2 addressed: CREATE_NEW now passes FILE_FLAG_OPEN_REPARSE_POINT (dangling symlink not followed); junction test asserts errUnsafeLog; NETGUARD_REQUIRE_PRIVILEGED_TESTS=1 turns privilege skips into failures for the planned windows-latest CI job (release-engineer). SECURITY.md MCP08 key-custody row stays open until that job is green. Follow-ups: \\?\ long-path prefix on Windows; ADR 0011 x/sys row in a separate docs PR. Merged in PR #33 (815c529) 2026-09-24; main CI green including the elevated Windows job.'
