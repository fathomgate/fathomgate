  - id: T0.12
    title: Restrict the audit key file to its owner on Windows (DACL) and open keys with O_EXCL plus chmod on every OS
    package: internal/audit
    owner: policy-engineer
    reviewers: [security-reviewer, go-reviewer]
    state: open
    blocked_by: [T0.1]
    adr: "0011"
    matrix: []
    notes: 'From the T0.7 security review. On Windows, SaveKey 0600 is ignored and the key inherits its folder ACL, so a local non-admin user can read audit.key and re-sign checkpoints over a rewritten log. os.WriteFile also keeps the mode of an existing file on Unix. Needs golang.org/x/sys/windows (ADR 0011). Targets M1; carry over if M0 closes first. Stopgap operator guidance is in SECURITY.md.'
