    package: .github/workflows
    owner: release-engineer
    reviewers: [go-reviewer]
    state: in review
    matrix: []
    notes: 'Runs 35901518242 and 35901475161 fail in 0s with a workflow file issue. The workflow has no push trigger; likely the job-level `if` on vars or the self-hosted label set. Root cause: unquoted `run: echo "TODO(M3): ..."` made the file invalid YAML. Fixed with a block scalar (commit 57b77fc); approved by go-reviewer 2026-09-23. Confirm on GitHub: no failed nightly-clab push run after merge.'
