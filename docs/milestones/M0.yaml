  - id: T0.39
    title: Stop netguard hanging at startup on upstreams that never answer server/discover (probe timeout, restart, straight to initialize)
    package: internal/proxy
    owner: mcp-protocol-engineer
    reviewers: [security-reviewer, go-reviewer]
    state: validated
    adr: "0018"
    matrix: [2]
    notes: 'From T0.34. go-sdk probes with server/discover before initialize and falls back only on an error reply; Python MCP SDK <= 1.9.3 servers (protocol 2024-11-05, e.g. upa on its own uv.lock) never answer, so netguard waits out its 30 s startup limit and exits 1 with context deadline exceeded. netguard passes ProtocolVersion nil at internal/proxy/proxy.go:200. Maintainer decision 2026-09-23: option A: if the probe gets no answer within about 5 s, restart the upstream and connect with initialize only (go-sdk skips the probe when ClientSessionOptions.ProtocolVersion is below 2026-07-28), with a clear log line. No CLI flag for now. ADR 0018 accepted by the maintainer 2026-09-24 (PR #74), so code may open. It bounds the first Connect at 5 s, retries only on deadline exceeded, kills and respawns the upstream, and reconnects with ClientSessionOptions.ProtocolVersion 2025-11-25 so go-sdk goes straight to initialize, with one warn line and no CLI flag in M0. ADR 0018 supersedes nothing; it amends ADR 0008 and ADR 0012 by dated cross-reference. It also forces the Upstream shape in ADR 0012''s API list to change, because restarting needs something that builds a transport more than once and an mcp.CommandTransport holds one exec.Cmd: the owning task picks the shape and records it in ADR 0012 and profile-schema 8.3 when the code lands. Update profile-schema 8.3 and 8.4 in the same PR. Do with T0.25. When fixed, the strict xfail test_locked_upstream_initialises_behind_netguard passes and must be removed, and matrix row 2 loses its T0.39 caveat (T0.41). Merged in PR #77 2026-09-24 before its reviews (maintainer). Both reviews then required changes: S1 an answered-then-rejected handshake was restarted as if unanswered; S3 the startup budget did not bound the second attempt; S4 wrong exit attribution; Go: a load-sensitive test (the child could be killed before its first read). All applied in PR #79 (merged 2026-09-24): a trackedConn wrapper on the newline transports records close-requested and hang-up under a mutex; retry only if the bound expired before go-sdk began closing; one connectAttempt kills on budget end for both attempts; grace capped to the time left; no restart once ctx has ended; a test-only discoverExpired channel makes the connect tests deterministic. Proxy.Upstream is now {Server, NewTransport func() mcp.Transport} (ADR 0012 and 0018 amendment rows, profile-schema 8.3 and 8.4). Security and Go re-reviews approve. Follow-ups: T0.46 (S2, a launcher''s grandchild survives the restart) and T0.47 (N6, era label). Validated 2026-09-24 against upa/mcp-netmiko-server 96e8ff3 on its own uv.lock (CI run 36050545450 on main at 51921ed): test_locked_upstream_initialises_behind_netguard passes as a plain test with protocol=2024-11-05 era=stateful and exactly one WARN restart line.'
  - id: T0.40
