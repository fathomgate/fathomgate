    title: tools/status/render.py writes CRLF on Windows, so status-check reports STATUS.md stale
    package: tools/status
    owner: docs-writer
    reviewers: [go-reviewer]
    state: in review
    matrix: []
    notes: 'write_text() uses the platform newline. Write LF explicitly and compare byte-for-byte in --check. Also `make status` calls python3, which is a Microsoft Store alias on Windows. Approved with nits by go-reviewer 2026-09-23 (commit b0f9c75); nits: fixture board in the test, BOM/trailing-newline case. render.py also wrote the platform encoding (cp1252) on Windows; the fix writes UTF-8.'
