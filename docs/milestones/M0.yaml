    notes: 'From T0.34. go-sdk probes with server/discover before initialize and falls back only on an error reply; Python MCP SDK <= 1.9.3 servers (protocol 2024-11-05, e.g. upa on its own uv.lock) never answer, so netguard waits out its 30 s startup limit and exits 1 with context deadline exceeded. netguard passes ProtocolVersion nil at internal/proxy/proxy.go:200. Maintainer decision 2026-09-23: option A: if the probe gets no answer within about 5 s, restart the upstream and connect with initialize only (go-sdk skips the probe when ClientSessionOptions.ProtocolVersion is below 2026-07-28), with a clear log line. No CLI flag for now. Needs an ADR first (it changes the negotiation in ADR 0008). Do with T0.25. When fixed, the strict xfail test_locked_upstream_initialises_behind_netguard passes and must be removed. Tabled until 2026-09-24.'
