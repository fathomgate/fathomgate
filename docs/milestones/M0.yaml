  - id: T0.27
    title: (*Proxy).HTTPHandler — era dispatcher over two go-sdk handlers, Host and Origin checks, bearer auth, in-flight and session caps, body limit
    package: internal/proxy
    owner: mcp-protocol-engineer
    reviewers: [security-reviewer, go-reviewer]
    state: merged
    blocked_by: [T0.28]
    adr: "0016"
    matrix: [23]
    notes: 'First of the HTTP listener tasks (maintainer decision 2026-09-23; ADR 0016 accepted 2026-09-23 with named tokens for attribution, built-in TLS in M1, not an M0 exit criterion, conformance shim accepted). Loopback-only bind, token required on every request, Origin and cross-site Sec-Fetch-Site refused before auth, no CORS, go-sdk localhost Host check on, caps and limits as in ADR 0016. Followed by T0.30 to T0.33. In progress 2026-09-23. Must also meet the T0.28 review requirements (T1-T4, see T0.28). Merged in PR #68 (c816209) 2026-09-23, before its reviews finished. Post-merge security review: request changes (H1 medium: a stateful upstream prompt can reach another principal''s agent via the sole-in-flight rule; H2 session-slot pinning; H3 refused connections held open; H4-H6 nits). Post-merge Go review: no correctness bugs, 30 race runs without flakes; G1 exports beyond ADR 0016, G2 shutdown order, G5 unjoined goroutine, test hygiene. All fixed in T0.38.'
  - id: T0.28
    title: Stop a slow agent from stalling an upstream's notification queue (progress relay writes off the dispatch goroutine)
    package: internal/proxy
    owner: mcp-protocol-engineer
    reviewers: [security-reviewer, go-reviewer]
    state: merged
    matrix: [2]
    notes: 'Security review S2 on PR #53. go-sdk handles an upstream''s notifications one at a time, and the progress relay writes to the agent under r.mu on that goroutine, so a stuck agent blocks every later message from that upstream (incl. elicitation/create for other calls), and finish() then blocks the deferred end(). Minor over stdio; real once several agents share an upstream over HTTP. Fix: per-relay one-slot latest mailbox plus sender goroutine (or bounded channel), mutex only for state, final notification with a deadline, and flush a held-back update on a timer (S4). Blocks T0.27. Merged in PR #63 2026-09-23. Security review: approve. Its follow-ups are requirements on T0.27: per-session and per-token call caps, write deadlines (T3); no JSONResponse and a pinned no-progress-after-result HTTP test (T4); remove the call from in-flight before waiting on the relay (T1); comment fix (T2).'
  - id: T0.29
    title: Record in the netdev-ssh-mcp profile that its secret obfuscation is an unkeyed hash
    package: profiles
    owner: upstream-server-scout
    reviewers: [security-reviewer]
    state: merged
    matrix: [15]
    notes: 'From T0.26. netdev-ssh-mcp v1.6.6 replaces secrets with [h:<first 6 bytes of sha256>] unless started with --no-obfuscate (internal/netdev/obfuscate.go). The hash is unkeyed, so short common values (public, private) are recoverable by hashing a word list; it does not meet invariant 4 and NetGuard must not rely on it. Note it in profiles/netdev-ssh-mcp.yaml comments and docs/research, and decide whether install docs recommend leaving it on in M0 (defence in depth) or off once NetGuard redacts (M2). Merged in PR #61 2026-09-23. Worse than first reported: several patterns hash a keyword (sha512, 7, ascii-text) and leave the secret in clear (eos 5/13, ios-xe 3/22, nxos 5/13, junos 7/13 fixture secrets), others are missed; NetGuard rules catch all. The upstream report is sent privately by the maintainer, not filed publicly; its draft was removed from the repo in a follow-up PR. M2 redaction must not skip lines holding an [h:...] token.'
