    notes: 'J1 (medium) a stateful prompt sent after its call finished normally (background job, or result-before-prompt dispatch race in go-sdk) still reaches another session''s human: track every ended call per session, not only cancelled ones. J2 register liveSession when a session-less POST''s response carries Mcp-Session-Id; go-sdk backstop timer longer than netguard''s. J3 separate shorter orphan TTL (default 5 min, orchestrator recommendation pending maintainer confirmation), Info log naming the blocking principal, threat-model row accepted. J5 key orphans by a netguard-assigned session id, not the pointer. J6 ADR 0016 principal text amendment. K2 prune orphans in end(); K3 comment on real-time idle clock; K4 single MCPGODEBUG refusal text. J4 (shutdown grace) stays in T0.31. Merged in PR #75 2026-09-24, before its security review: post-merge security review pending (handoff 2026-09-24-mcp-protocol-engineer-to-security-reviewer-T0.40). ADR 0016 gains three amendment rows: J6 principal text, HTTPOptions.OrphanTTL default 5 min, and proxy.ErrMCPGODEBUG. Orchestrator ruling 2026-09-24: that export-surface growth stays an in-place amendment of ADR 0016, which owns the surface, not a new record, because 0016''s decision (one exported entry point; limits as constants, not flags) is unchanged and its own 2026-09-23 row set the precedent with MaxSessionsPerPrincipal; the K4 row now says the one-export framing reads as one entry point plus its options type, its path constant and one sentinel error. The 5-minute orphan TTL is still the orchestrator recommendation, not a maintainer decision. No longer blocks T0.30 and T0.31. Maintainer confirmed the 5-minute orphan TTL 2026-09-24, so it is now a maintainer decision. The post-merge security review produced T0.42-T0.45.'
  - id: T0.41
