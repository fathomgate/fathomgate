    notes: 'Found by docs-writer while writing ADR 0018. Row 2 says three different things: its Status cell reads passing, its own prose ends "so the row stays open", and the CHANGELOG entry for T0.34 says row 2 stays planned. The legend at test-matrix.md line 3 allows only planned, passing and skipped, so "open" is not a status word at all. This matters because M0 exit criterion 3 is ticked as met and cites row 2. Orchestrator reading, to confirm or overturn rather than to apply blind: the tick is sound, because the criterion names the 2025-11-25 and 2026-07-28 eras and the failing case is a 2024-11-05 lockfile, which is neither and is tracked as T0.39; on that reading the cell stays passing and the prose should say the 2024-11-05 case falls outside the criterion instead of saying the row is open. Pick one word, make the cell, the prose and the CHANGELOG agree, and do not invent a fourth status. Row 2 loses its T0.39 caveat when T0.39 lands, so sequence this after T0.39 or write it to survive that. T0.39 has merged (PR #77 and #79) and removed row 2''s T0.39 caveat, including the words so the row stays open, so this is unblocked. The Go review of PR #77 also asked for a test-engineer sign-off on row 2''s rewritten text; do it here. PR #81 (test-engineer, 2026-09-24): row 2 is passing in the cell, its prose and the CHANGELOG, with a dated run note naming netdev-ssh-mcp v1.6.6 (2026-07-28), upa 96e8ff3 with mcp 1.30.0 (2025-11-25) and the same commit on its own uv.lock with mcp 1.6.0 (2024-11-05). Test-engineer sign-off on the row 2 text is in the handoff to docs-writer. Merged in PR #81 2026-09-24 after the docs-writer review (the cell now says which agent eras each server was tested with).'
