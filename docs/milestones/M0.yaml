    title: Make TestKeyRoundTrip portable — file-mode assertion fails on Windows (-rw-rw-rw-)
    package: internal/audit
    owner: policy-engineer
    reviewers: [go-reviewer, security-reviewer]
    state: in review
    matrix: []
    notes: Found by the M0 kickoff green check on Windows (go1.26.7). Linux CI is green. Skip or relax the 0600 assertion on GOOS=windows only; keep it strict elsewhere. Do not weaken SaveKey. Approved with nits by security-reviewer and go-reviewer 2026-09-23 (commit 6155c28); key-ACL finding split out as T0.12.
