    title: Keep device passwords off the netguard command line (upstream secrets from a file or the environment)
    package: cmd/netguard
    owner: mcp-protocol-engineer
    reviewers: [security-reviewer, go-reviewer]
    state: merged
    matrix: [22]
    notes: 'From T0.5. The only way to give netdev-ssh-mcp a device password is --upstream-env DEVICE_PASSWORD=..., which shows in ps and sits in the client mcp.json. ssh-agent works but SSH_AUTH_SOCK must be passed explicitly. Changes the CLI surface, so it needs an ADR (e.g. --upstream-env-file, or passing through named variables from netguard''s own environment) before code. ADR 0017 (PR #55) merged 2026-09-23 with status proposed: recommends --upstream-env-pass NAME. Awaiting the maintainer''s acceptance and answers to its four open questions before implementation. ADR 0017 accepted by the maintainer 2026-09-23: --upstream-env-pass NAME; no secret-key warning; NETGUARD_* refused on both flags; exact passed values (4 bytes or more) scrubbed from relayed upstream stderr as [redacted:NAME]; an empty value exits 2. Ready for implementation. Merged in PR #64 2026-09-23: --upstream-env-pass per ADR 0017; security review requested changes (E1 medium: a password typed as a separate argument was echoed), E1-E7 fixed in the PR. The PR merged before the re-review finished; the post-merge re-review against main (b4c3b4e) found no issue: E1-E7 fixed or documented residuals, no new bypass from the T0.28 merge. Doc note N1 (the built transport holds the value in Env; M4 audit must never log it) goes into the next internal/proxy PR.'
  - id: T0.24
    title: Fix the platform-dependent nolint in internal/audit/key_unix.go so make lint passes on darwin and linux/arm64
    package: internal/audit
    owner: policy-engineer
    reviewers: [security-reviewer, go-reviewer]
