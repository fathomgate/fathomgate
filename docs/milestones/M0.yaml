    adr: "0014"
    matrix: [2, 23]
    notes: 'S3, medium, from the post-merge security review of T0.40. internal/proxy/input.go:597-600 calls p.refuse(u, s, ...) with a non-nil call, which sets s.refused; proxy.go:623-627 then substitutes that text for the upstream''s own error. The branch fires exactly when the prompt was NOT attributable to that call, so an unattributable refusal lands in the slot reserved for the call''s own prompt, while the sibling note slot exists precisely to append rather than replace. A hostile upstream can trigger it at will on any stateless-era call and so speak in netguard''s voice about why the call failed; from M1 the agent and the M4 audit line then record a reason netguard invented for a call that may be WRITE_CONFIG. Nothing leaks: the text names only u.name, s.tool and a static sentence, so invariant 7 holds. The residual is existence-and-timing (the agent learns a prompt happened on that upstream around then) and should be stated rather than left implicit. Reviewer''s fix is one line, p.refuse(u, nil, ...); era_pairs is unaffected because it reads the upstream-facing refusal, which does not change. SECURITY.md:73 currently promises the refusal is never put in place of an upstream error or result, and is false as merged: fix the code or amend that line in the same PR. The ADR 0014 ordering itself stands (accepted in T0.40); only the slot is wrong. Must land before T0.31; does not block T0.30. Merged in PR #78 2026-09-24. Implemented as refuseAsNote(u, s, ...) rather than refuse(u, nil, ...): the note goes on the one attributed call only, because refuse(u, nil) would have put text naming s.tool on every call in flight, possibly another session''s. Visible change: over HTTP a 2026 agent on a 2025 upstream that fails now sees the upstream''s error. SECURITY.md:73 is true again and the existence-and-timing residual is stated. Security and Go reviews approve.'
  - id: T0.43
    title: Key the local stdio agent session explicitly so a built HTTP listener cannot push it into the shared orphan bucket (S1)
    package: internal/proxy
    owner: mcp-protocol-engineer
    reviewers: [security-reviewer, go-reviewer]
    state: merged
    matrix: [2, 23]
    notes: 'S1, medium, from the post-merge security review of T0.40. Proxy.agentSessionKey (internal/proxy/input.go:69-79) decides the key from whether the proxy has a listener rather than from what the session is: a stdio session has no id, so once p.limits is non-nil it keys the empty string, end() routes it to u.orphanOverflow, and attribute() treats that entry as foreign to every call including the stdio agent''s own. After its first tool call ends, no stateful upstream prompt reaches anyone on that upstream for OrphanTTL, renewed indefinitely by the agent''s own traffic. This contradicts profile-schema 8.4 line 289 (on stdio one agent session owns the process, so its own orphan never blocks a prompt that could otherwise be relayed) and the comment at input.go:63-64. Latent today: HTTPHandler and checkListenEnvironment have no non-test caller, so p.limits is always nil in the shipped binary. It goes live with T0.31, which serves both transports from the one p.server. Reviewer''s options: record the local agent''s ServerSession at Run time and key it localAgentKey, or make --listen and stdio mutually exclusive in code and say so in 8.4. The former also settles the one-stdio-session-per-process assumption. Must land before T0.31; does not block T0.30. Merged in PR #78 2026-09-24. Each Proxy.Run gets its own key (l1, l2, ...) rather than one localAgentKey; a second Run is allowed and documented, not refused. No lock is held across Connect: Run registers a ready channel in p.connecting, and a local request waits on it until the session is recorded. The transport is not wrapped, because go-sdk''s ioConn carries an unexported sessionUpdated used for batch refusal that a wrapper would drop (verified by the security reviewer). Listener calls are keyed from the session id or principal first and never wait (re-review L1). Security (three rounds) and Go reviews approve.'
  - id: T0.44
    title: Bound, reap and log the shared orphan entry so cross-principal refusal is neither indefinite nor silent (S2, S4)
    package: internal/proxy
    owner: mcp-protocol-engineer
    reviewers: [security-reviewer, go-reviewer]
    state: merged
    matrix: [23]
    notes: 'S2 (medium) and S4 (low) from the post-merge security review of T0.40. S2: every session-id-less request shares one u.orphanOverflow entry, so one authenticated principal can hold every other principal''s stateful prompts in refusal at one stateless request per OrphanTTL (each 2026-era request gets a per-request go-sdk session with an empty id), or by opening 1024 sequential stateful sessions to overflow the table. MaxSessionsPerPrincipal bounds neither: the sessions are sequential and orphans outlive them. It fails closed, so no prompt reaches the wrong human and nothing leaks, which is why it is medium and not high; the cost is availability across principals, and from M3 a refused prompt is the shape an approval or a credential request takes. Reviewer''s suggested direction, maintainer''s to choose: give each per-request stateless session a distinct synthetic key so its orphan becomes a prunable, loggable table entry instead of a global switch. That does not fix the 1024-entry overflow, which needs the overflow entry to be something other than refuse-everyone. S4: the shared entry is never pruned (pruneOrphans walks only u.orphans), never logged, and carries no principal, so three assurances are false for the case that will dominate: profile-schema lines 289 and 321, and threat-model line 38 (so a refused prompt can be explained from the log), which is the operator''s stated recourse. The committed test at internal/proxy/http_review_test.go:405 asserts orphanOverflow.IsZero() after pruning, pinning the absence of overflow rather than its reaping, so the gap is locked in and that test must change with the fix. Also rewrite the accepted residual at threat-model line 38: up to OrphanTTL is a per-event bound presented as a steady-state one, it omits the shared entry, and it names a recourse that does not exist; the reviewer supplied replacement wording. Fix the doc part now, the code part with S2. Must land before T0.31; does not block T0.30. Doc part merged in PR #78 2026-09-24: the shared-entry cross-principal refusal is its own Open threat-model row (owner mcp-protocol-engineer, blocks T0.31), and SECURITY.md and 8.4 say Open, not accepted. Maintainer decision 2026-09-24: give each per-request stateless session a distinct synthetic key, so its orphan is a prunable, logged, principal-attributed table entry. The 1024-entry overflow still needs something other than refuse-everyone; the owner proposes it in the code PR for the maintainer to accept. Merged in PR #82 2026-09-24. Each session-less call gets its own r<n> key; the shared orphanOverflow entry is gone. Per-principal quota of 256 orphan records per upstream, past which that principal''s ended calls fold into one overflow record of its own that refuses everyone (fails closed). Every refusal is one rate-limited Warn line naming ended_calls_of or in_flight_of principals, never upstream bytes. s<id> keys only for stateful agents. TestOrphanModelNeverFailsOpen is a randomized reference model that fails on both of the security reviewer''s mutants. Maintainer decisions 2026-09-24: the residual is accepted (any principal that can call a stateful upstream can keep others'' prompts on it refused by ending one call per OrphanTTL or holding one open; fails closed; token removal is the only recourse), and one orphan record per stateless request is kept. Threat-model row 39 is Accepted (residual); row 40 (M3, Open, mcp-protocol-engineer) asks for per-upstream prompt policy or binding a prompting stateful upstream to one principal before a refused prompt can be an approval or credential request. Security (three rounds) and Go reviews approve; CI green on the self-hosted runners. No longer blocks T0.31.'
  - id: T0.45
    title: Correct the agentSessionKey comment and record the register-after-flush idle-timer window (S5, S7)
    package: internal/proxy
    owner: mcp-protocol-engineer
    reviewers: [go-reviewer]
    state: merged
    matrix: []
    notes: 'Notes from the post-merge security review of T0.40, neither a vulnerability. S5: the comment at internal/proxy/input.go:66-68 says an unauthenticated call would be keyed as its own session rather than grouped with the local agent''s. The empty key is not its own session, it is the shared bucket, foreign to everyone including itself, which is strictly more blocking and the opposite of the bullet list eight lines above. Wording only, but it is what a future author will trust when touching this. S7: settleSession (http.go:602) runs in a defer after the stateful handler has already flushed Mcp-Session-Id, so an agent that POSTs again immediately finds h.live[sid] nil, skips ls.startPOST(), and arm() starts the idle timer with active zero; a call from that POST can then be cancelled at SessionTimeout while it is in progress. Pre-existing: J2 widened which sessions get registered, in the safe direction, and did not create the window. No cross-session effect. Record it in 8.5 or fix it, but do not leave it unwritten. Neither blocks T0.30 nor T0.31. Merged in PR #78 2026-09-24. S5 comment corrected. S7 fixed rather than documented: a POST that arrives before its session is registered is counted and folded into the session''s in-progress POSTs, so the idle clock does not start under it (TestPOSTBeforeRegistration).'
  - id: T0.46
    title: Kill the upstream's whole process tree so a launcher's grandchild cannot outlive a restart or shutdown (S2)
    package: internal/proxy
    owner: mcp-protocol-engineer
    reviewers: [security-reviewer, go-reviewer]
    state: merged
    matrix: [2, 22]
    notes: 'S2, medium, from the security review of PR #77 (T0.39). When --upstream is a launcher (uvx, npx, uv run, a shell script, docker run -i), the ADR 0018 restart kills only the launcher. The real server, which by T0.34''s evidence never exits once its receive loop dies, keeps running beside the second copy with the same --upstream-env-pass credentials and any device sessions it opened. It cannot be driven (its stdio is closed), so this is credential and resource exposure, not a bypass. It also lets startup overrun its budget by up to WaitDelay (2 s) while a grandchild holds stderr. Fix: a process group on Unix (Setpgid, kill the group) and a Job Object with kill-on-close on Windows. Needs an ADR first: golang.org/x/sys/windows is a direct dependency, but ADR 0011 scopes it to internal/audit. Until then docs/install.md and the README say to point --upstream at the server, not a launcher, and the threat model carries an open row. Verified 2026-09-24 on Windows 11 with Python 3.13 (python -m venv and uv venv): the venv''s Scripts python.exe is a redirector whose child dies when the redirector is killed, so it is safe to name. ADR drafted 2026-09-25 (proposed): process group on Unix, Job Object on Windows, widening ADR 0011''s x/sys scope to internal/proxy. Code waits on the maintainer''s acceptance. ADR 0021 accepted by the maintainer 2026-09-25 (PR #107). Code started. Merged in PR #111 2026-09-25. ADR 0021 implemented: process group on Unix, Job Object with a suspended start on Windows, a macOS go test job (not yet required). Security and Go reviews approve after one fix round. Residuals recorded: setsid and parent-process spoofing on Windows escape by design; docker run -i; a Unix crash; PID reuse in the 2 s sweep window; setuid launchers (Warn on EPERM). Use docker run --init in containers.'
  - id: T0.47
    title: Label the upstream era from the negotiated protocol version, not from how fathomgate connected, before M1 audits it (N6)
    package: internal/proxy
    owner: mcp-protocol-engineer
    reviewers: [security-reviewer, go-reviewer]
    state: open
    matrix: [2]
    notes: 'N6, note, from the security reviews of PR #77 and #79. After an initialize-only connect (the ADR 0018 retry), an upstream may answer 2026-07-28; up.version and eraOf then label a stateful session era=stateless. In M0 this reaches only log lines. It becomes an audit-accuracy issue when M1 writes the upstream era into the audit event, so fix it before that wiring. Does not block M0 exit.'
  - id: T0.48
    title: Apply the post-merge reviews of T0.30 (log tampered requestState retries, drop or use the unused progress owner fields, doc and test nits)
    package: internal/proxy
    owner: mcp-protocol-engineer
    reviewers: [security-reviewer, go-reviewer]
    state: merged
    adr: "0016"
    matrix: [23]
    notes: 'From the post-merge security and Go reviews of PR #85 (T0.30), both approve. Security L2 = Go 1: a same-principal retry that keeps a valid state but changes the arguments or tool after the human answered is refused with -32602 but never logged; call warnState on the post-open mismatch branches (input.go:285-289) with netguard''s own reason words, or narrow the 8.2 row; prefer logging. Security L1 = Go 2: progressRelay.sessionKey, transport and principal (progress.go:83-92) are written but read only by a test, while ADR 0016, 8.4 and the threat-model Progress token scope row cite them as a control; the guarantee is the unique token per request; remove them or give them a real reader, and reword the docs. Notes: 8.4 line 290 r<n> wording (stateless over the listener); state in the doc comment that the refused-state limiter key has no tool; add half a sentence on stateful sessions presenting a stateless request''s state of the same principal; pin transportOf fail-closed with Extra nil and a principal present; at least 128 bits (rand.Text is about 130); draw upToken only in watchProgress; name warnState in the refusalLimiter godoc; typed agentTransport; reword the TestCallCarriesTransportAndPrincipal godoc; t.Cleanup releasing TestProgressRelayPerSession''s gates on failure; add the 30-minute same-token residual to the cross-principal replay threat-model row. Must land before T0.31. Merged in PR #88 2026-09-24 (3268f9a). Security and Go reviews approve. The Go reviewer''s two test-hardening items (injected clock in TestTamperedRetryLogged, t.Context() in TestProgressRelayPerSession), two nits and the threat-model stdio-side residual sentence missed the merge and land as a small follow-up PR. Security L1 (deferred to T0.31): transportOf reads only req.Extra, so a listener call with Extra nil would bind as {stdio, ""} and could open a stdio-issued state when one Proxy serves both sides; latent because netguard serve keeps them exclusive. M3 notes: decide whether a verified-but-tampered presentation burns the single-use id.'
  - id: T0.49
    title: Rename NetGuard to Fathomgate per ADR 0019 (module path, binary, FATHOMGATE_ env prefix, fg4. state prefix, fg- CSS prefix, reported server name, docs and design)
    package: repo
    owner: orchestrator
    reviewers: [security-reviewer, go-reviewer, release-engineer, design-guardian]
    state: merged
    blocked_by: [T0.48]
    adr: "0019"
    matrix: []
    notes: 'ADR 0019 accepted by the maintainer 2026-09-24. One PR, after T0.48 merges and before T0.31 opens, so T0.31 is built with the new names. Scope and the old-to-new map are in the ADR: module github.com/fathomgate/fathomgate (the org is created by the maintainer; every package is internal/, so the PR can merge before the repo transfer), binary fathomgate, display name Fathomgate, FATHOMGATE_ env prefix with no NETGUARD_ fallback, sealed state fg4. with ng1-ng3 retired, CSS fg-, reported MCP server name and [from ...] label fathomgate, paths /etc/fathomgate, agent slug netguard-orchestrator becomes orchestrator. Not renamed: history, ADRs 0001-0018, handoff notes, research briefs, merged task notes. The self-hosted runner label netguard stays until those runners are removed. Needs make conformance and a security review (internal/proxy, internal/audit paths). Repo stays private; going public follows ADR 0019''s conditional checklist and ADR 0020. T0.48 merged, so this starts 2026-09-24. The GitHub org exists as lowercase fathomgate (maintainer). Merged in PR #93 2026-09-24 (6f9b85b); security and Go reviews approve (one fix: Homebrew tap owner fathomgate). CI green on the runners at 15822b2, -race, conformance and both tier-2 jobs included. The maintainer then transferred the repository to github.com/fathomgate/fathomgate the same day; the three self-hosted runners moved with it and keep running jobs.'
  - id: T0.50
    title: Give each self-hosted runner its own Go build and module cache
    package: .github/workflows
    owner: release-engineer
    reviewers: [go-reviewer]
    state: dropped
    matrix: []
    notes: 'The three WSL runners share one GOCACHE (~/.cache/go-build, 3.6 GB) and module cache, and every job''s setup-go restores the Actions cache into them while other runners compile from the same directory. PR #93''s snapshot job failed once with "link: crypto/ed25519: reference to nonexistent package runtime" for darwin_amd64 and passed on a re-run, which fits a cache overwritten in use. Fix without sudo if possible: a first step that writes GOCACHE and GOMODCACHE under the runner''s own directory to GITHUB_ENV before setup-go (or setup-go cache off), or per-runner .env entries with a service restart (sudo; runbook). Record it in docs/ci-runners.md. Also note there that the runners'' .runner still names github.com/joshscott13/netguard and works through GitHub''s redirect after the transfer; re-register under fathomgate/fathomgate if the redirect ever stops working. Dropped 2026-09-25: the repository went public and CI moved back to GitHub-hosted runners (PR #96); the self-hosted runners are removed, so there is no shared cache to split.'
  - id: T0.51
    title: Move tier 2 and the docs to netdev-ssh-mcp v1.7.1, which fixes the keyed-hash issue Fathomgate reported
    package: tests/integration
    owner: test-engineer
    reviewers: [docs-writer, security-reviewer]
    state: merged
    matrix: [1, 15, 22]
    notes: 'From the public-history audit 2026-09-24. Upstream fixed the unkeyed-hash obfuscation Fathomgate reported (T0.29) in GHSA-8g43-jrf3-q9vq (v1.7.0, maintainer credited) and GHSA-h47r-329w-6p9h (v1.7.1). docs/install.md, the netdev-ssh-mcp profile notes and the tier 2 pin (release binary sha256 in ci.yaml, tests/README.md) still name v1.6.6. Bump the pinned binary and its sha256, re-run tier 2 against it, update the profile notes (what v1.7.x changed about obfuscation, verified from source), docs/install.md and the matrix rows that name the version, and link both advisories. Re-check matrix row 15 against the new behaviour. Merged in PR #108 2026-09-25; security and docs reviews approve after one fix round. The key file is optional; the default per-run key is stronger when the agent can read files.'
  - id: T0.52
    title: Apply the post-merge security review of PR #109 (--listen binds both loopback families; port-squatting row; slot exhaustion; macOS ACLs; proxy export ADR)
    package: cmd/fathomgate
    owner: mcp-protocol-engineer
    reviewers: [security-reviewer, go-reviewer]
    state: merged
    adr: "0016"
    matrix: [23]
    notes: 'H1 (high): --listen localhost:P or 127.0.0.1:P binds only 127.0.0.1:P (listen.go:65-67); another local user can bind [::1]:P and an agent using http://localhost:P tries ::1 first, so it sends its bearer token to the attacker (reproduced). Fix: bind the other loopback family on the same port too, refuse to start if it is taken, regression test; install.md says to paste the exact listening URL. M1: port squatting while fathomgate is down or restarting, a threat-model row, Open until M1 TLS or a socket. L1: tokenless connections can fill the 128 slots. L2: macOS extended ACLs on token files (and the audit key) are not detected. L3: a short ADR restating the exported surface of internal/proxy instead of another ADR 0016 amendment. Notes N1 (same-user processes, the upstream included, can act as a principal), N2 (no overall shutdown deadline; second signal ignored). Blocks T0.32 and T0.33 and any tag. Merged in PR #112 2026-09-25. H1 closed: --listen binds the same port on 127.0.0.1 and [::1], refuses to start if the other is taken, and accepts only localhost, 127.0.0.1 or [::1]; CI runs the H1 tests with FATHOMGATE_REQUIRE_BOTH_LOOPBACKS=1 on Linux, macOS and Windows. A new connection must send its first request within 3 s (ConnContext timer); 401 and 403 close the connection; macOS extended ACLs are refused on token files, the audit key and the audit log (internal/fileacl); a second signal forces exit. ADR 0022 (internal/proxy export surface) and ADR 0023 (both loopback families) accepted by the maintainer 2026-09-25. Security and Go reviews after one fix round each. M1 port squatting stays Open until TLS or a socket.'
  - id: T0.53
    title: Record the PR #108 review's upstream-content findings in the threat model and route them to M1 and M2
    package: docs/security
    owner: security-reviewer
    reviewers: [docs-writer]
    state: open
    matrix: [15, 16]
    notes: 'From the security review of PR #108 (T0.51). Rows to add: upstream text addressed to the agent inside tool results (Open until M2 labelling of every content block); upstream instructions are not relayed (mitigated, pinned by the T0.51 test); an upstream obfuscation key readable by the agent (documented); whitespace variants such as show  running-config dodge netdev-ssh-mcp config-dump detection (M1 classify must collapse whitespace; add a tier 1 case); leading-dash arguments to run_ping and run_traceroute (upstream-server-scout); upstream tool description changes on version bump (M2 row 16 needs a re-pin workflow). Also: gitleaks is not in CI. Also from the security review of PR #111 (N5): on Windows an upstream can open fathomgate''s own process with at least PROCESS_CREATE_PROCESS and PROCESS_DUP_HANDLE, and probably PROCESS_VM_READ, which could read other upstreams'' secrets from fathomgate''s memory; give it its own row and consider a restrictive process DACL.'
  - id: T0.54
    title: Write the product name as Fathomgate in prose across docs (ADR 0019 voice rule)
    package: docs
    owner: docs-writer
    reviewers: [design-guardian]
    state: open
    matrix: []
    notes: 'From the docs review of PR #108. docs/install.md and other docs inherited lower-case netguard-in-prose and now say fathomgate in prose; ADR 0019 wants Fathomgate in prose and fathomgate in mono for the command and typed values. One sweep after T0.52 merges, not file by file.'
  - id: T0.55
    title: Check the audit signing key like every other secret file, and stop audit verify trusting a private key
    package: internal/audit
    owner: policy-engineer
    reviewers: [security-reviewer, go-reviewer]
    state: open
    matrix: []
    notes: 'From the security review of PR #112 (medium, predates it, MCP08). audit.LoadKey (internal/audit/key.go:138) calls os.ReadFile: it follows symbolic links and checks no owner, mode, link count, Windows DACL or macOS ACL. LoadPublicKey (key.go:160-173) accepts a private key file and derives the public key from it, so audit verify --key <signing key> trusts the file the signer uses. Latent: nothing signs in production until M1 wires serve --audit. Fix: open the key like openExistingLog and readTokenFile (O_NOFOLLOW, regular file, one link, owned by the current user, 0600 or 0400, fileacl.Extended, protected DACL on Windows), and make verify refuse a private key as its trust anchor. Needs a short ADR on key custody (also PLAN.md open question on key custody). Blocks the M1 task that wires --audit.'
  - id: T0.56
    title: Make DESIGN.md and tokens.css agree on the INVENTORY_READ class chip colour
    package: design
    owner: design-guardian
    reviewers: [docs-writer]
    state: in review
    matrix: []
    notes: 'From the design review of PR #113. design/DESIGN.md (the class chip section, about line 54) says INVENTORY_READ chips use muted text, but design/tokens.css:119 sets --class-inventory: var(--info). Decide which is right and make the spec and the tokens agree. Decided muted: --class-inventory and its selector removed, so every class but WRITE_CONFIG and EXEC_ARBITRARY takes --class-read; DESIGN.md lists all seven classes.'
  - id: T0.57
    title: Stop the listener's session cap and orphan rule locking out an agent that restarts without ending its session
    package: internal/proxy
    owner: mcp-protocol-engineer
    reviewers: [security-reviewer, go-reviewer]
    state: in review
    adr: "0016"
    matrix: [23]
    notes: 'From T0.32 (PR #116). Each principal may hold 4 stateful sessions with a 30-minute idle timeout. A client that never sends DELETE (a crashed or restarted agent; the TypeScript SDK close() does not DELETE, only terminateSession() does) leaves its session behind, so the fifth initialize gets 503 for up to 30 minutes. Conformance shows it: 13 x 503 per 2025-11-25 run. Options: evict the principal''s oldest idle session (no POST in flight, no GET stream) when a new initialize would exceed the cap, or a shorter idle timeout for such sessions; whichever, keep the cap as a bound on live sessions and state the change in ADR 0016 by amendment. Same task: the orphan rule (ended_calls_of) refuses a reconnected client''s stateful-upstream prompts for OrphanTTL (5 min) because of calls its own earlier session ended; decide with security review whether the same principal''s new session may inherit them. Also look at the server-sse-retry-field WARNING (no retry: field on the SSE stream) on the fathomgate 2025-11-25 legs. Update the conformance baselines if the 503s go away. Recommended before the v0.1.0 tag, since --listen is new in it. In review on branch fix/session-cap-lockout (2026-09-25): at a session cap the principal''s least recently used idle session (no POST, no GET stream, no call in flight) is evicted, with 404 for its later requests; another principal''s never; otherwise 503, now logged with the reason. Orphan rule unchanged: a principal''s new session does not inherit its old session''s ended calls (reasoning in the handoff to security-reviewer). SSE retry field recorded, not changed (go-sdk writes it only with an event store). The conformance 503s stay: the suite leaves each failed scenario''s GET stream open, so no baseline entry changed. ADR 0016 amendment of 2026-09-25.'
