# Expected failures: fathomgate leg (relay -> fathomgate serve -> go-sdk
# everything-server), --requirements 2026-07-28 (stateless agent). Format and
# exit rules: tests/conformance/README.md. An entry that starts passing fails
# the run, so a fix must delete its entry in the same PR.
#
# The first block is identical to control-2026-07-28.yml (HTTP transport,
# the relay's behaviour). Everything after it is a difference fathomgate makes.
# Every group names the ADR or board task that decided it or owns the gap
# (M0 exit criterion 1).
server:
  # --- Same as the control leg: HTTP transport, not fathomgate -------------
  # ADR 0012 (M0 serves the agent over stdio only) and T0.4 (the relay): see
  # control-2026-07-28.yml.
  - server-stateless:sep-2575-http-server-header-mismatch-400
  - server-stateless:sep-2575-http-server-meta-invalid-400
  - server-stateless:sep-2575-http-server-method-not-found-404
  - server-stateless:sep-2575-http-server-method-not-found-404-initialize
  - server-stateless:sep-2575-http-server-method-not-found-404-logging-setlevel
  - server-stateless:sep-2575-http-server-method-not-found-404-ping
  - server-stateless:sep-2575-http-server-method-not-found-404-resources-subscribe
  - server-stateless:sep-2575-http-server-method-not-found-404-resources-unsubscribe
  - server-stateless:sep-2575-http-server-unsupported-version-400
  - server-stateless:sep-2575-missing-capability-http-400
  - server-stateless:sep-2575-request-meta-invalid-missing-meta
  - server-stateless:sep-2575-request-meta-invalid-missing-protocol-version

  # --- fathomgate ------------------------------------------------------------
  # Undeclared capabilities. Decided in T0.3: fathomgate declares only `tools`
  # and answers -32601 for prompts/*, resources/* and completion/complete
  # (profile-schema section 8.2). The caching checks call prompts/list,
  # resources/list and resources/templates/list; non-tool-request calls
  # prompts/get.
  - completion-complete:completion-complete
  - prompts-list:prompts-list
  - prompts-get-simple:prompts-get-simple
  - prompts-get-with-args:prompts-get-with-args
  - prompts-get-embedded-resource:prompts-get-embedded-resource
  - prompts-get-with-image:prompts-get-with-image
  - resources-list:resources-list
  - resources-read-text:resources-read-text
  - resources-read-binary:resources-read-binary
  - resources-templates-read:resources-templates-read
  - caching:sep-2549-prompts-list-caching-hints
  - caching:sep-2549-resources-list-caching-hints
  - caching:sep-2549-resources-templates-list-caching-hints
  - input-required-result-non-tool-request:sep-2322-non-tool-incomplete
  # T0.3 (same decision), SHOULD-level (the suite reports WARNING; a
  # baseline run counts it). The resource-not-found probe gets -32601
  # because resources are undeclared.
  - sep-2164-resource-not-found:sep-2164-error-code
  - sep-2164-resource-not-found:sep-2164-data-uri
  # T0.18 and ADR 0014 (the sealed requestState, normative in profile-schema
  # section 8.4), SHOULD-level. The check sends inputResponses, one for the
  # fixture's real input id plus two unknown ones, with no requestState, and
  # wants the call to complete. fathomgate ignores them all (section 8.2: it
  # forwards only answers to prompts it relayed, bound by its requestState)
  # and returns the upstream's fresh, relabelled input_required. Completing
  # would mean forwarding an agent's answer to an upstream prompt no human
  # was shown through fathomgate, so this stays by design. T0.18 relaxed the
  # rest: no -32602 for this case any more, and unknown ids under a valid
  # requestState are dropped rather than refused.
  - input-required-result-ignore-extra-params:sep-2322-ignore-unexpected-params
  # ADR 0008 and T0.3: upstream input requests for sampling/createMessage
  # and roots/list are refused with a labelled tool error; only form
  # elicitation is relayed (profile-schema section 8.4).
  # multiple-input-requests and capability-check include a sampling request,
  # so the whole call is refused.
  - input-required-result-basic-sampling:sep-2322-sampling-incomplete
  - input-required-result-basic-list-roots:sep-2322-list-roots-incomplete
  - input-required-result-multiple-input-requests:sep-2322-multiple-inputs-incomplete
  - input-required-result-capability-check:sep-2322-respect-client-capabilities
  # ADR 0012 (the <server>.<tool> prefix, profile-schema section 8.1) and
  # T0.4 (the relay renames only tools/call). This check looks for
  # `test_missing_capability` in tools/list, which fathomgate lists as
  # `conf.test_missing_capability`. The check reports "Not testable", so the
  # undeclared-capability rejection (-32021) is not exercised through
  # fathomgate.
  - server-stateless:sep-2575-server-rejects-undeclared-capability
