# Expected failures: fathomgate-up2025 leg (shim -> fathomgate serve --listen
# -> go-sdk v1.6.1 everything-server over stdio, a 2025-11-25-only upstream),
# --requirements 2025-11-25. Agent 2025-11-25 x upstream 2025-11-25: stateful
# on both sides. Format and exit rules: tests/conformance/README.md. An entry
# that starts passing fails the run, so a fix must delete its entry in the
# same PR.
#
# control-up2025-2025-11-25.yml is empty, so each failure here is a
# difference fathomgate makes. Every group names the ADR or board task that
# decided it (M0 exit criterion 1).
#
# One fathomgate process serves every scenario's session (T0.32), which
# changes two things against the relay (one fathomgate per session):
# - The session cap. As on the fathomgate leg (see the header of
#   fathomgate-2025-11-25.yml), the four scenarios that throw on an
#   undeclared method leave their sessions open, and from resources-read-text
#   on every `initialize` gets 503 (4 stateful sessions per principal: ADR
#   0016 limit 7, profile-schema 8.5 limit 8). dns-rebinding-protection runs
#   after that point too, so its entry cannot go stale on this leg (see
#   fathomgate-2025-11-25.yml); only the 2026-07-28 legs would notice.
# - The orphan rule. tools-call-elicitation and elicitation-sep1034-defaults
#   passed through the relay and fail here (orphan group below).
# run.sh then runs tools-call-elicitation, elicitation-sep1034-defaults and
# server-session-lifecycle again, each alone on a fresh fathomgate, where
# they must pass outright (README, "One process").
server:
  # Undeclared capabilities. Decided in T0.3: fathomgate declares only `tools`
  # toward the agent and answers -32601 for prompts/*, resources/*,
  # logging/setLevel and completion/complete (profile-schema section 8.2).
  # Same list as fathomgate-2025-11-25.yml. From resources-read-text on,
  # these fail with 503 first (the session cap, header comment).
  - completion-complete:completion-complete
  - logging-set-level:logging-set-level
  - prompts-list:prompts-list
  - prompts-get-simple:prompts-get-simple
  - prompts-get-with-args:prompts-get-with-args
  - prompts-get-embedded-resource:prompts-get-embedded-resource
  - prompts-get-with-image:prompts-get-with-image
  - resources-list:resources-list
  - resources-read-text:resources-read-text
  - resources-read-binary:resources-read-binary
  - resources-templates-read:resources-templates-read
  - resources-subscribe:resources-subscribe
  - resources-unsubscribe:resources-unsubscribe
  # T0.3 (same decision): logging/setLevel is undeclared and no upstream
  # notifications/message is relayed.
  - tools-call-with-logging:tools-call-with-logging
  # ADR 0008: upstream sampling/createMessage is refused (profile-schema
  # section 8.4). By design, in every era pair.
  - tools-call-sampling:tools-call-sampling
  # T0.3 (the elicitation schema allow-list, profile-schema section 8.4),
  # hit one layer earlier by go-sdk. The fixture's test_elicitation_sep1330_enums
  # asks for five enum fields; `titledMulti` is an array whose `items` has
  # `type: "string"` and `anyOf` but no `enum`. fathomgate's upstream client
  # (go-sdk v1.8.0, validateElicitArrayProperty in mcp/client.go) reads
  # items.type "string" as an untitled multi-select, refuses the request with
  # -32602 "items must specify enum for untitled enums" before fathomgate's
  # handler runs, and the fixture tool returns that as a tool error, so no
  # prompt reaches the agent ("Server did not request elicitation from
  # client"). The control leg passes because the suite's client (TypeScript
  # SDK) does not validate the schema. Behind that layer fathomgate's
  # allow-list would still refuse `titledMulti` (an array property needs
  # items.enum; items.anyOf is not on the list) and drop `legacyEnum`'s
  # deprecated `enumNames`, so the per-field checks could not pass either.
  # go-sdk v1.8.0's own everything-server sends the same schema.
  - elicitation-sep1330-enums:elicitation-sep1330-general
  # ADR 0016, amended by T0.40 (J1, J3: OrphanTTL, 5 minutes, for every call
  # that ends) and T0.44 (the accepted residual); profile-schema 8.4
  # *Attribution across agent sessions*. New with T0.32. A stateful
  # upstream's elicitation/create names no call, so fathomgate refuses a
  # prompt while any other agent session's call on that upstream ended less
  # than OrphanTTL ago. The suite runs each scenario in a new session of the
  # same fathomgate, and earlier scenarios' calls (tools-call-sampling among
  # them) ended moments before, so the prompt is refused ("it cannot be
  # attributed to one call: another agent session's call on this upstream
  # has ended recently", Warn in chain.log) and the suite sees no
  # elicitation. Refusing is the documented safe answer when fathomgate
  # cannot tell whose prompt it is. Both checks are still scored: run.sh
  # runs each scenario again alone on a fresh fathomgate, where one session
  # holds the only call and both must pass (SEP-1034 defaults included).
  # era_pairs.py adds the `[from conf]` label on the message and field title,
  # which no suite check looks at, over the listener and over stdio.
  - tools-call-elicitation:tools-call-elicitation
  - elicitation-sep1034-defaults:elicitation-sep1034-general
  # ADR 0016 (Request handling, step 3; profile-schema 8.5 limit 3), new with
  # T0.32: fathomgate answers 403 to any request with an Origin, a same-host
  # one included (a DNS-rebinding page sends exactly that). See
  # fathomgate-2025-11-25.yml. On this leg it runs after the session cap is
  # reached and cannot go stale (header comment).
  - dns-rebinding-protection:localhost-host-valid-accepted
