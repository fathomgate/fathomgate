[project]
name = "netguard-tests"
version = "0.1.0"
description = "Python companion for NetGuard: policy-lint, fixture servers and tiered tests"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "pyyaml>=6.0",
  "pytest>=8.0",
  "mcp>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pyyaml>=6.0"]
integration = ["mcp>=1.0", "pytest-asyncio>=0.23", "asyncssh>=2.14"]

[project.scripts]
policy-lint = "policy_lint.lint:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["policy_lint"]

[tool.pytest.ini_options]
testpaths = ["unit", "integration"]
markers = [
  "tier1: no network, synthetic requests",
  "tier2: real MCP server in a container, fake device",
  "tier3: real device in containerlab (nightly, self-hosted)",
  "asyncio: async test (pytest-asyncio)",
]
addopts = "-ra"

[tool.uv]
package = true
