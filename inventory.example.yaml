# Example static inventory for Fathomgate. Copy to inventory.yaml and edit, or
# generate one with `fathomgate inventory import --csv devices.csv --out inventory.yaml`.
#
# devices: exact (case-insensitive) hostname match. Every device the agent
#          may reach is listed here by name, and nothing else is known: a
#          name not listed is unknown, and the policy's unknown_target
#          default decides it.
# roles:   optional hostname patterns, tried for anything not listed. This
#          example ships none active; see the warning at the end of the file
#          before you turn any on.
devices:
  - name: core-rtr-01
    role: core
    site: dfw1
    tags: [prod, critical]
    status: active
  - name: core-rtr-02
    role: core
    site: dfw1
    tags: [prod, critical]
    status: active
  - name: border-rtr-01
    role: border
    site: dfw1
    tags: [prod, internet-edge]
    status: active
  - name: dc-spine-01
    role: spine
    site: dfw1
    tags: [prod, fabric]
    status: active
  - name: dc-leaf-01
    role: leaf
    site: dfw1
    tags: [prod, fabric]
    status: active
  - name: acc-sw-01
    role: access
    site: dfw1
    tags: [prod, campus]
    status: active
  - name: fw-edge-01
    role: firewall
    site: dfw1
    tags: [prod, internet-edge]
    status: active
  - name: lab-leaf-01
    role: leaf
    site: lab
    tags: [lab]
    status: active
  - name: lab-spine-01
    role: spine
    site: lab
    tags: [lab]
    status: active
  # The containerlab topology in docs/testing/test-strategy.md.
  - name: lab-sw-01
    role: access
    site: lab
    tags: [lab]
    status: active
  - name: lab-sw-02
    role: access
    site: lab
    tags: [lab]
    status: active
  - name: lab-srl-01
    role: leaf
    site: lab
    tags: [lab]
    status: active

# Hostname patterns: none active, on purpose.
#
# The target name comes from the agent, and today any pattern match makes the
# name a known device, so the unknown-target default no longer stops it:
#   - Reads reach it. Every example policy allows reads on a known device, so
#     "core-x.attacker.example" would get get_config, and an upstream that
#     takes a free-form host (netdev-ssh-mcp) logs in to it with the
#     operator's device password or SSH agent. Config output is not redacted
#     until M2.
#   - Patterns are case-insensitive and not anchored at the end unless you add
#     "$", and names with ".", "@" or ":" still match: "^lab-" matches
#     "LAB-x", "lab-x.attacker.example" and "lab-x@core-rtr-01".
#   - A tag or role that unlocks a write (lab-open's device_tags: [lab],
#     prod-approval's device_roles) must never come from a pattern: it lets
#     the agent write to a name it made up.
# Turn a pattern on only if every name it can match is a device you would let
# the agent read, anchor both ends, and give it no write-unlocking tag or role.
#
# The shape, commented out (sets only a site, anchored at both ends):
# roles:
#   - match: "^dfw1-acc-sw-[0-9]{2}$"
#     site: dfw1
