# Example static inventory for Fathomgate. Copy to inventory.yaml and edit, or
# generate one with `fathomgate inventory import --csv devices.csv --out inventory.yaml`.
#
# devices: exact (case-insensitive) hostname match. Every device the agent
#          may reach is listed here by name, and nothing else is known: a
#          name not listed is unknown, and the policy's unknown_target
#          default decides it.
# roles:   optional hostname patterns. A pattern never makes a name known: it
#          only fills in a role or site a listed device leaves empty and adds
#          its tags (ADR 0031). This example ships none active; see the end
#          of the file.
devices:
  - name: core-rtr-01
    role: core
    site: dfw1
    tags: [prod, critical]
    status: active
  - name: core-rtr-02
    role: core
    site: dfw1
    tags: [prod, critical]
    status: active
  - name: border-rtr-01
    role: border
    site: dfw1
    tags: [prod, internet-edge]
    status: active
  - name: dc-spine-01
    role: spine
    site: dfw1
    tags: [prod, fabric]
    status: active
  - name: dc-leaf-01
    role: leaf
    site: dfw1
    tags: [prod, fabric]
    status: active
  - name: acc-sw-01
    role: access
    site: dfw1
    tags: [prod, campus]
    status: active
  - name: fw-edge-01
    role: firewall
    site: dfw1
    tags: [prod, internet-edge]
    status: active
  - name: lab-leaf-01
    role: leaf
    site: lab
    tags: [lab]
    status: active
  - name: lab-spine-01
    role: spine
    site: lab
    tags: [lab]
    status: active
  # The containerlab topology in docs/testing/test-strategy.md.
  - name: lab-sw-01
    role: access
    site: lab
    tags: [lab]
    status: active
  - name: lab-sw-02
    role: access
    site: lab
    tags: [lab]
    status: active
  - name: lab-srl-01
    role: leaf
    site: lab
    tags: [lab]
    status: active

# Hostname patterns: none active.
#
# A pattern adds attributes to devices listed above and does nothing else: a
# name the agent makes up ("core-x.attacker.example", "lab-ghost-99") stays
# unknown whatever pattern it matches, and the policy's unknown_target default
# decides it (ADR 0031). For each listed device that a pattern matches:
#   - the device's own role and site win; the first matching pattern in file
#     order fills a role or site the device leaves empty;
#   - tags from every matching pattern are added to the device's own.
# What a loose pattern can still do is mislabel a device you listed, and the
# role and tags it gives count for every rule, write rules included: "^lab-"
# with tags: [lab] makes a listed "lab-core-01" writable under lab-open even
# if it is really a core router. Patterns are case-insensitive and not
# anchored at the end unless you add "$"; anchor them as tightly as you can,
# and put a role or a tag that unlocks writes (lab-open's lab, prod-approval's
# core and border roles) on the device itself rather than in a pattern.
# `fathomgate inventory lint` fails on a pattern that matches no listed
# device (`fathomgate serve` warns about one), and warns for every role, site
# or tag a pattern adds to a listed device, so you can check each one.
#
# The shape, commented out. Each pattern matches devices listed above and
# sets only a site or a tag no example policy matches on:
# roles:
#   - match: "^(core|border)-rtr-[0-9]{2}$"
#     tags: [backbone]
#   - match: "^dc-(spine|leaf)-[0-9]{2}$"
#     site: dfw1
#   - match: "^lab-[a-z]+-[0-9]{2}$"
#     site: lab
