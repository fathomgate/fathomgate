  # Annotations only ever raise a class (invariant 3).
  - name: "readOnlyHint false raises a read tool to EXEC_ARBITRARY"
    request:
      server: netdev-ssh-mcp
      tool: run_show_command
      arguments: {host: lab-sw-01, command: show version}
      annotations: {readOnlyHint: false}
    expect: {effect: deny, rule: no-exec, class: EXEC_ARBITRARY, class_source: annotation_raise}
  - name: "destructiveHint true raises a read tool to EXEC_ARBITRARY"
    request:
      server: eos-mcp
      tool: get_version
      arguments: {hostname: lab-sw-01}
      annotations: {destructiveHint: true}
    expect: {effect: deny, rule: no-exec, class: EXEC_ARBITRARY, class_source: annotation_raise}
  - name: "readOnlyHint true does not lower reload"
    request:
      server: upa
      tool: send_command_and_get_output
      arguments: {name: lab-sw-01, command: reload}
      annotations: {readOnlyHint: true, destructiveHint: false}
    expect: {effect: deny, rule: no-exec, class: EXEC_ARBITRARY}

  # Writes, and config lines that leave the session (M1-36).
  - name: "an eos-mcp config push is a write, denied by no-writes"
    request:
      server: eos-mcp
      tool: push_config
      arguments: {hostname: lab-sw-01, config_lines: [hostname lab-sw-01-new]}
    expect: {effect: deny, rule: no-writes, class: WRITE_CONFIG}
  - name: "config lines that end the session and reload are EXEC_ARBITRARY"
    request:
      server: eos-mcp
      tool: push_config
      arguments: {hostname: lab-sw-01, config_lines: [end, reload now]}
    expect: {effect: deny, rule: no-exec, class: EXEC_ARBITRARY}
  - name: "a Junos set command is a write"
    request:
      server: junos-mcp-server
      tool: load_and_commit_config
      arguments: {router_name: core-rtr-01, config_text: set system host-name x}
    expect: {effect: deny, rule: no-writes, class: WRITE_CONFIG}
  - name: "a Jinja2 template runs code on the upstream host, so it is EXEC_ARBITRARY"
    request:
      server: junos-mcp-server
      tool: render_and_apply_j2_template
      arguments: {router_name: lab-sw-01, template_content: "set system host-name {{ h }}", vars_content: "h: x"}
    expect: {effect: deny, rule: no-exec, class: EXEC_ARBITRARY}

  # Local admin and the session cap.
  - name: "trust_host_key is local admin, denied"
    request:
      server: netdev-ssh-mcp
      tool: trust_host_key
      arguments: {host: lab-sw-01}
    expect: {effect: deny, rule: no-lab-or-admin, class: LOCAL_ADMIN}
  - name: "a read past the session device cap is denied"
    request:
      server: eos-mcp
      tool: get_version
      arguments: {hostname: lab-sw-01}
      session: {devices_touched: 20}
    expect: {effect: deny, rule: default:session.max_devices}
