# Gate cases for prod-approval.yaml (ADR 0035), run with `fathomgate policy
# test` or `make policy-test`. Each case is a tools/call as an agent sends it:
# the server, the tool and the raw arguments. It runs through internal/gate,
# the steps `fathomgate serve --policy` runs, with the profiles built into the
# binary (or `policy test --profiles <dir>`) and the inventory below.
# prod-approval.test.yaml keeps the class-given cases.
#
# `forwarded` and `tool_error` say what serve does in M1: a hold, and an allow
# that carries dry_run, diff or timed_rollback, are not run until M3 (ADR
# 0026). These are tier 1 evidence; test-matrix rows 3, 4 and 6 are validated
# only against the real upstream servers (M1-28).
policy: prod-approval.yaml
inventory:
  devices:
    - {name: core-rtr-01, role: core, site: dfw1, tags: [prod]}
    - {name: core-rtr-09, site: dfw1, tags: [prod]}
    - {name: border-rtr-01, role: border, site: dfw1, tags: [prod]}
    - {name: dc-leaf-01, role: leaf, site: dfw1, tags: [prod]}
    - {name: dc-leaf-02, role: leaf, site: dfw1, tags: [prod]}
    - {name: dc-leaf-03, role: leaf, site: dfw1, tags: [prod]}
    - {name: dc-leaf-04, role: leaf, site: dfw1, tags: [prod]}
    - {name: lab-sw-01, role: access, site: lab, tags: [lab]}
  roles:
    - match: "^(core|border)-rtr-[0-9]{2}$"
      role: core
cases:
  # The spot check in the policy engineer's workflow.
  - name: "a Junos set statement on a core router is held with dry_run, diff and timed_rollback"
    request:
      server: junos-mcp-server
      tool: load_and_commit_config
      arguments: {router_name: core-rtr-01, config_text: set system host-name x}
    expect:
      effect: hold
      rule: prod-core-needs-approval
      class: WRITE_CONFIG
      obligations: [dry_run, diff, timed_rollback]
      targets: [core-rtr-01]
      forwarded: false
      tool_error: "fathomgate held junos-mcp-server.load_and_commit_config: rule prod-core-needs-approval (class WRITE_CONFIG): needs approval, and approvals aren't available yet, so this call was not run."
  - name: "a listed router given the core role by the pattern is held"
    request:
      server: eos-mcp
      tool: push_config
      arguments: {hostname: core-rtr-09, config_lines: [hostname x]}
    expect: {effect: hold, rule: prod-core-needs-approval}
  - name: "a border router write is held"
    request:
      server: eos-mcp
      tool: push_config
      arguments: {hostname: border-rtr-01, config_lines: [hostname x]}
    expect: {effect: hold, rule: prod-core-needs-approval}
  - name: "a third pending hold is denied"
    request:
      server: junos-mcp-server
      tool: load_and_commit_config
      arguments: {router_name: core-rtr-01, config_text: set system host-name x}
      session: {pending_holds: 2}
    expect:
      effect: deny
      rule: default:session.max_pending
      tool_error: "fathomgate denied junos-mcp-server.load_and_commit_config: rule default:session.max_pending (class WRITE_CONFIG): this session already has as many held calls as its cap allows"

  # Lab writes carry dry_run and diff, which nothing can meet until M3.
  - name: "a lab write is allowed but cannot run in M1"
    request:
      server: eos-mcp
      tool: push_config
      arguments: {hostname: lab-sw-01, config_lines: [hostname x]}
    expect:
      effect: allow
      rule: lab-writes-free
      obligations: [dry_run, diff]
      forwarded: false
      tool_error: "fathomgate cannot run eos-mcp.push_config: rule lab-writes-free (class WRITE_CONFIG): obligation dry_run cannot be met until change-safety drivers exist"

  # Writes no rule covers, and the fan-out cap.
  - name: "a write to one leaf matches no rule"
    request:
      server: ntunes-netmiko-mcp-server
      tool: send_config
      arguments: {device: dc-leaf-01, config_commands: [hostname x]}
    expect:
      effect: deny
      rule: default:no-match
      tool_error: "fathomgate denied ntunes-netmiko-mcp-server.send_config: rule default:no-match (class WRITE_CONFIG): no rule matched"
  - name: "a write to four leaves is denied by fleet-cap"
    request:
      server: ntunes-netmiko-mcp-server
      tool: send_config_parallel
      arguments: {devices: [dc-leaf-01, dc-leaf-02, dc-leaf-03, dc-leaf-04], config_commands: [hostname x]}
    expect:
      effect: deny
      rule: fleet-cap
      targets: [dc-leaf-01, dc-leaf-02, dc-leaf-03, dc-leaf-04]
      tool_error: "fathomgate denied ntunes-netmiko-mcp-server.send_config_parallel: rule fleet-cap (class WRITE_CONFIG): fan-out above 3 devices needs a change ticket"
  - name: "a repeated target counts once toward fleet-cap"
    request:
      server: ntunes-netmiko-mcp-server
      tool: send_config_parallel
      arguments: {devices: [dc-leaf-01, dc-leaf-02, dc-leaf-03, dc-leaf-03], config_commands: [hostname x]}
    expect: {effect: deny, rule: default:no-match, targets: [dc-leaf-01, dc-leaf-02, dc-leaf-03]}
  - name: "a read of six devices is past the session device cap"
    request:
      server: eos-mcp
      tool: get_device_facts_batch
      arguments: {hostnames: [core-rtr-01, border-rtr-01, dc-leaf-01, dc-leaf-02, dc-leaf-03, dc-leaf-04]}
    expect: {effect: deny, rule: default:session.max_devices}

  # Rows 3, 4 and 6.
  - name: "row 3: netdev-ssh-mcp run_show_command show ip bgp summary is allowed on a core router"
    request:
      server: netdev-ssh-mcp
      tool: run_show_command
      arguments: {host: core-rtr-01, command: show ip bgp summary}
    expect: {effect: allow, rule: reads-anywhere, class: READ_OPERATIONAL, forwarded: true}
  - name: "row 4: upa send_command_and_get_output reload is denied by no-exec, not held"
    request:
      server: upa
      tool: send_command_and_get_output
      arguments: {name: core-rtr-01, command: reload}
    expect: {effect: deny, rule: no-exec, class: EXEC_ARBITRARY}
  - name: "row 4: eos-mcp run_command reload is denied by no-exec"
    request:
      server: eos-mcp
      tool: run_command
      arguments: {hostname: core-rtr-01, command: reload}
    expect:
      effect: deny
      rule: no-exec
      tool_error: "fathomgate denied eos-mcp.run_command: rule no-exec (class EXEC_ARBITRARY): EXEC_ARBITRARY is denied: the call runs commands outside the read allow-list or outside configuration mode"
  - name: "row 6: a write to an unlisted host is denied, not held"
    request:
      server: junos-mcp-server
      tool: load_and_commit_config
      arguments: {router_name: core-x.attacker.example, config_text: set system host-name x}
    expect: {effect: deny, rule: default:unknown_target, class: WRITE_CONFIG, unknown_target: true}
  - name: "row 6: a read of an unlisted host is denied"
    request:
      server: netdev-ssh-mcp
      tool: run_show_command
      arguments: {host: 192.0.2.99, command: show version}
    expect: {effect: deny, rule: default:unknown_target, unknown_target: true}

  # A config payload that leaves the session is exec, not a held write.
  - name: "config lines that end the session on a core router are EXEC_ARBITRARY, not held"
    request:
      server: eos-mcp
      tool: push_config
      arguments: {hostname: core-rtr-01, config_lines: [end, reload now]}
    expect: {effect: deny, rule: no-exec, class: EXEC_ARBITRARY}
