# lab-open: for a containerlab or EVE-NG environment where every lab device
# carries the "lab" tag. Writes to lab devices are allowed; anything not
# tagged lab is denied so a stray production hostname in the same inventory
# stays safe. Arbitrary commands that the classifier could not prove to be
# reads are denied even in the lab, because "reload" on a lab node still
# costs an afternoon.
#
# List lab devices by name in the inventory. A hostname pattern such as ^lab-
# with tags: [lab] only tags devices the inventory lists; a name the agent
# makes up stays unknown and is denied (ADR 0031). A pattern's tag counts
# here like a listed one, so anchor it tightly: ^lab- would also make a
# listed "lab-core-01" writable.
#
# M1–M2: a write fathomgate allows here is sent to the device as the agent
# wrote it — no dry run, no diff, no rollback; until M4 no audit event, only
# the decision log line.
#
# That is because lab-writes-free carries no dry_run or diff until M3.
# fathomgate cannot run a dry run or take a diff until the change-safety
# drivers land in M3, and an allow that carries an obligation it cannot meet
# is not forwarded (ADR 0026), so with those obligations every lab write
# would be refused. They return to lab-writes-free in M3 as
# obligations: [dry_run, diff].
version: 1
defaults:
  unknown_target: deny
  session:
    max_devices: 50
rules:
  - id: reads-anywhere
    match: { class: [READ_OPERATIONAL, READ_CONFIG, INVENTORY_READ] }
    effect: allow
  # M3: obligations [dry_run, diff] return here (see the header).
  - id: lab-writes-free
    match: { class: [WRITE_CONFIG], device_tags: [lab] }
    effect: allow
  - id: lab-lifecycle
    match: { class: [LAB_LIFECYCLE], device_tags: [lab] }
    effect: allow
  - id: no-exec
    match: { class: [EXEC_ARBITRARY] }
    effect: deny
    reason: "EXEC_ARBITRARY is denied: the call runs commands outside the read allow-list or outside configuration mode"
  - id: not-lab
    effect: deny
    reason: "only devices tagged lab may be changed through this proxy"
