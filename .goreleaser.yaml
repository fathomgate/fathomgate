# GoReleaser configuration for Fathomgate. Runs on tag push via
# .github/workflows/release.yaml; `make release-snapshot` for a local dry run.
version: 2

project_name: fathomgate

before:
  hooks:
    - go mod tidy
    - go test ./...
    # THIRD_PARTY_LICENSES/ must match the modules this release links
    # (ADR 0020); `make licences` regenerates it.
    - python3 tools/licences/third_party.py --check

builds:
  - id: fathomgate
    main: ./cmd/fathomgate
    binary: fathomgate
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    mod_timestamp: "{{ .CommitTimestamp }}"
    flags: [-trimpath]
    ldflags:
      - -s -w
      - -X main.version={{ .Version }}
      - -X main.commit={{ .ShortCommit }}
      - -X main.date={{ .CommitDate }}

archives:
  - id: default
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    # LICENSE, NOTICE and THIRD_PARTY_LICENSES/ (every linked module's
    # licence text) travel with every binary (ADR 0020).
    files:
      - LICENSE
      - NOTICE
      # `**/*` needs at least one directory level, so the index is listed too.
      - THIRD_PARTY_LICENSES/README.md
      - THIRD_PARTY_LICENSES/**/*
      - TRADEMARKS.md
      - README.md
      - policies/examples/*
      - profiles/*
      - inventory.example.yaml

checksum:
  name_template: checksums.txt
  algorithm: sha256

sboms:
  - id: archive
    artifacts: archive
    documents: ["{{ .ArtifactName }}.spdx.sbom.json"]

changelog:
  sort: asc
  use: github
  filters:
    exclude: ["^docs:", "^chore:", "^test:"]

release:
  draft: false
  prerelease: auto
  footer: |
    Verify a download with `sha256sum -c checksums.txt`.

# Homebrew tap placeholder: create fathomgate/homebrew-tap and set
# HOMEBREW_TAP_GITHUB_TOKEN before the first tagged release.
brews:
  - name: fathomgate
    repository:
      owner: fathomgate
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    directory: Formula
    homepage: https://github.com/fathomgate/fathomgate
    description: Policy-enforcing MCP proxy for network-device MCP servers
    license: Apache-2.0
    test: |
      system "#{bin}/fathomgate", "version"
    skip_upload: auto

dockers:
  - image_templates:
      - "ghcr.io/fathomgate/fathomgate:{{ .Version }}-amd64"
    dockerfile: Dockerfile.goreleaser
    # Copied into the image under /usr/share/doc/fathomgate/ (ADR 0020).
    extra_files:
      - LICENSE
      - NOTICE
      - THIRD_PARTY_LICENSES
    goarch: amd64
    use: buildx
    build_flag_templates: ["--platform=linux/amd64"]
    skip_push: auto
