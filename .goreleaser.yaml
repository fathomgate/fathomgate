# GoReleaser configuration for Fathomgate. Runs on tag push via
# .github/workflows/release.yaml; `make release-snapshot` for a local dry run.
version: 2

project_name: fathomgate

before:
  hooks:
    - go mod tidy
    - go test ./...
    # THIRD_PARTY_LICENSES/ must match the modules this release links
    # (ADR 0020); `make licences` regenerates it.
    - python3 tools/licences/third_party.py --check

builds:
  - id: fathomgate
    main: ./cmd/fathomgate
    binary: fathomgate
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    mod_timestamp: "{{ .CommitTimestamp }}"
    flags: [-trimpath]
    ldflags:
      - -s -w
      - -X main.version={{ .Version }}
      - -X main.commit={{ .ShortCommit }}
      - -X main.date={{ .CommitDate }}

archives:
  - id: default
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    # LICENSE, NOTICE and THIRD_PARTY_LICENSES/ (every linked module's
    # licence text) travel with every binary (ADR 0020).
    files:
      - LICENSE
      - NOTICE
      # `**/*` needs at least one directory level, so the index is listed too.
      - THIRD_PARTY_LICENSES/README.md
      - THIRD_PARTY_LICENSES/**/*
      - TRADEMARKS.md
      - README.md
      - policies/examples/*
      - profiles/*
      - inventory.example.yaml

checksum:
  name_template: checksums.txt
  algorithm: sha256

# cosign keyless (Sigstore) signature of checksums.txt, which covers every
# archive and SBOM. The Fulcio certificate names this repository's
# .github/workflows/release.yaml at the tag, so only a tag run can produce a
# bundle that verifies (release.yaml grants id-token: write to that job only;
# snapshot.yaml runs --skip=sign). One Sigstore bundle holds the signature,
# the certificate and the Rekor entry. Verify with:
#   cosign verify-blob --bundle checksums.txt.sigstore.json \
#     --certificate-identity https://github.com/fathomgate/fathomgate/.github/workflows/release.yaml@refs/tags/vX.Y.Z \
#     --certificate-oidc-issuer https://token.actions.githubusercontent.com checksums.txt
signs:
  - id: checksum-cosign
    cmd: cosign
    artifacts: checksum
    signature: "${artifact}.sigstore.json"
    args:
      - sign-blob
      - "--bundle=${signature}"
      - "--yes"
      - "${artifact}"
    output: true

sboms:
  - id: archive
    artifacts: archive
    documents: ["{{ .ArtifactName }}.spdx.sbom.json"]

changelog:
  sort: asc
  use: github
  filters:
    exclude: ["^docs:", "^chore:", "^test:"]

release:
  draft: false
  prerelease: auto
  footer: |
    Verify `checksums.txt` with `cosign verify-blob --bundle checksums.txt.sigstore.json --certificate-identity https://github.com/fathomgate/fathomgate/.github/workflows/release.yaml@refs/tags/{{ .Tag }} --certificate-oidc-issuer https://token.actions.githubusercontent.com checksums.txt`, then a download with `sha256sum -c checksums.txt --ignore-missing`.

# Homebrew tap: fathomgate/homebrew-tap does not exist yet, so the formula is
# generated into dist/homebrew/ and never uploaded. Uploading with no tap (or
# with GITHUB_TOKEN, which cannot write to another repository) fails the
# release job after the GitHub release is already public. To turn it on:
# create the tap, add a fine-grained HOMEBREW_TAP_GITHUB_TOKEN (contents: write
# on the tap only) as a repository secret, and set skip_upload back to auto.
brews:
  - name: fathomgate
    repository:
      owner: fathomgate
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    directory: Formula
    homepage: https://github.com/fathomgate/fathomgate
    description: Policy-enforcing MCP proxy for network-device MCP servers
    license: Apache-2.0
    test: |
      system "#{bin}/fathomgate", "version"
    skip_upload: true

# The image is built (snapshot.yaml checks it runs as nonroot with no shell)
# but not pushed yet: it is amd64 only, tagged only `<version>-amd64`, and
# unsigned. It is pushed once there is an arm64 build, a manifest tagged
# vX.Y.Z, vX.Y and latest, and cosign signing; until then skip_push is true.
dockers:
  - image_templates:
      - "ghcr.io/fathomgate/fathomgate:{{ .Version }}-amd64"
    dockerfile: Dockerfile.goreleaser
    # Copied into the image under /usr/share/doc/fathomgate/ (ADR 0020).
    extra_files:
      - LICENSE
      - NOTICE
      - THIRD_PARTY_LICENSES
    goarch: amd64
    use: buildx
    build_flag_templates: ["--platform=linux/amd64"]
    skip_push: true
